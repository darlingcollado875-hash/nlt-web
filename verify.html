<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://wjczkcuxptzpayzemttb.supabase.co">
    <title>Verificar certificado | NLT Academy</title>
    <meta name="description" content="Verificá la autenticidad de un certificado de NLT Academy.">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="assets/css/tailwind.css?v=20260814e">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"></noscript>
    <link rel="preload" as="style" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/regular/style.css" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" as="style" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/bold/style.css" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" as="style" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/fill/style.css" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/regular/style.css">
        <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/bold/style.css">
        <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/fill/style.css">
    </noscript>
    <style>
        body { background-color: #080A0F; color: #ffffff; -webkit-font-smoothing: antialiased; min-height: 100vh; }
        .glass-card { background: linear-gradient(180deg, rgba(17, 21, 28, 0.7) 0%, rgba(13, 16, 22, 0.9) 100%); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; }
    </style>
</head>
<body class="flex items-center justify-center px-6 py-16">
    <div class="fixed top-[-15%] left-1/2 -translate-x-1/2 w-[900px] h-[600px] bg-blue-600/10 blur-[140px] rounded-full pointer-events-none z-0"></div>

    <div class="relative z-10 w-full max-w-3xl">
        <div class="flex items-center justify-center gap-3 mb-8">
            <img src="assets/img/nlt-mark.svg" alt="NLT" class="w-8 h-8">
            <span class="font-semibold text-base tracking-tight">NLT Academy -- Verificación</span>
        </div>

        <div id="resultBox" class="glass-card p-10 text-center">
            <p class="text-sm text-gray-500 animate-pulse">Verificando certificado...</p>
        </div>

        <p class="text-center mt-8"><a href="academy.html" class="text-xs text-gray-500 hover:text-white transition-colors">Volver a NLT Academy</a></p>
    </div>

    <script src="assets/js/nlt-certificate.js?v=20260814b"></script>
    <script>
        const BASE_URL = ['localhost', '127.0.0.1'].includes(window.location.hostname)
            ? 'http://127.0.0.1:8091'
            : 'https://nlt-api-production.up.railway.app';

        function getCode() {
            const parts = window.location.pathname.split('/').filter(Boolean);
            const fromPath = parts.length && parts[0] !== 'verify.html' ? parts[parts.length - 1] : null;
            const fromQuery = new URLSearchParams(window.location.search).get('code');
            return fromQuery || fromPath || '';
        }

        async function verificar() {
            const box = document.getElementById('resultBox');
            const code = getCode();
            if (!code) {
                box.innerHTML = `<i class="ph-fill ph-question text-4xl text-gray-600 mb-3"></i><p class="text-white font-semibold">Falta el código de certificado.</p>`;
                return;
            }
            try {
                const resp = await fetch(`${BASE_URL}/academy/verify/${encodeURIComponent(code)}`);
                const data = await resp.json();
                if (!data.valid) {
                    box.innerHTML = `
                        <i class="ph-fill ph-x-circle text-4xl text-nlt-danger mb-3"></i>
                        <p class="text-white font-semibold mb-1">Certificado no encontrado</p>
                        <p class="text-xs text-gray-500">El código <span class="font-mono">${code}</span> no corresponde a ningún certificado emitido por NLT Academy.</p>
                    `;
                    return;
                }
                box.className = 'w-full';
                box.innerHTML = `
                    <div class="flex items-center justify-center gap-2 mb-6">
                        <i class="ph-fill ph-seal-check text-nlt-success text-xl"></i>
                        <p class="text-xs text-nlt-success font-bold uppercase tracking-widest">Certificado verificado -- auténtico</p>
                    </div>
                    <div id="certHolder"></div>
                    <div class="flex justify-center mt-6">
                        <button id="btn-descargar-certificado" class="px-5 py-2.5 rounded-xl bg-nlt-accent text-white text-xs font-semibold cursor-pointer flex items-center gap-2"><i class="ph-fill ph-download-simple"></i> Descargar (PDF)</button>
                    </div>
                `;
                NLT_CERT.render(document.getElementById('certHolder'), {
                    title: data.title, slug: data.slug, student_name: data.student_name,
                    certificate_code: data.certificate_code, issued_at: data.issued_at,
                    verification_url: window.location.href, description: data.description,
                });
                document.getElementById('btn-descargar-certificado').addEventListener('click', async () => {
                    const btn = document.getElementById('btn-descargar-certificado');
                    const original = btn.innerHTML;
                    btn.disabled = true;
                    btn.className = btn.className.replace('cursor-pointer', 'cursor-wait opacity-70');
                    btn.innerHTML = '<i class="ph-fill ph-spinner-gap animate-spin"></i> Generando PDF...';
                    try {
                        await NLT_CERT.descargarPDF(document.getElementById('nltCertNode'), `Certificado-NLT-Academy-${data.certificate_code}.pdf`);
                    } catch (err) {
                        alert('No se pudo generar el PDF: ' + err.message);
                    } finally {
                        btn.disabled = false;
                        btn.className = btn.className.replace('cursor-wait opacity-70', 'cursor-pointer');
                        btn.innerHTML = original;
                    }
                });
            } catch (err) {
                box.innerHTML = `<i class="ph-fill ph-warning-circle text-4xl text-yellow-400 mb-3"></i><p class="text-white font-semibold">No se pudo verificar ahora mismo.</p><p class="text-xs text-gray-500 mt-1">${err.message}</p>`;
            }
        }
        verificar();
    </script>
</body>
</html>
