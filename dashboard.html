    <style>
        body { background-color: #080A0F; background-image: radial-gradient(650px circle at 0% 0%, rgba(67,120,255,0.09), transparent 60%), radial-gradient(550px circle at 100% 100%, rgba(34,197,94,0.05), transparent 60%); background-attachment: fixed; color: #FFFFFF; -webkit-font-smoothing: antialiased; }
        /* Carga: shimmer en vez de "—" / "0" mientras llegan los datos reales */
        [data-skel] { position: relative; color: transparent !important; min-width: 3.2ch; display: inline-block; border-radius: 10px; background: linear-gradient(100deg, rgba(255,255,255,0.05) 30%, rgba(255,255,255,0.13) 50%, rgba(255,255,255,0.05) 70%) 0 0 / 220% 100%; animation: nlt-skel 1.4s ease-in-out infinite; text-shadow: none; }
        @keyframes nlt-skel { to { background-position: -120% 0; } }
        @media (prefers-reduced-motion: reduce) { [data-skel] { animation: none; } }
        /* Primeros pasos */
        .ob-step { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.025); transition: border-color .25s ease, background .25s ease, transform .25s ease; }
        a.ob-step:hover { border-color: rgba(var(--c), 0.5); background: rgba(var(--c), 0.07); transform: translateX(3px); }
        .ob-num { width: 30px; height: 30px; border-radius: 10px; flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 800; color: rgb(var(--c)); background: rgba(var(--c), 0.12); border: 1px solid rgba(var(--c), 0.3); }
        .ob-step.done { opacity: .55; } .ob-step.done .ob-num { background: rgb(var(--c)); color: #07090e; }
        .ob-bar { height: 4px; border-radius: 4px; background: rgba(255,255,255,0.07); overflow: hidden; } .ob-bar i { display: block; height: 100%; width: var(--w, 0%); border-radius: 4px; background: linear-gradient(90deg, #4378ff, #22d3ee, #22c55e); transition: width .8s cubic-bezier(.16,1,.3,1); }
        /* Mapa de cuentas */
        .am { position: relative; }
        .am-stage { position: relative; }
        .am-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
        .am-ln { fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-dasharray: 3 7; opacity: .5; }
        .am-ln.live { opacity: .95; animation: am-dash 2.2s linear infinite; }
        @keyframes am-dash { to { stroke-dashoffset: -20; } }
        .am-node { --c: 34,197,94; position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 10px; padding: 9px 14px 9px 10px; border-radius: 14px; text-decoration: none;
                   background: linear-gradient(180deg, #161c2a, #0d111a); border: 1px solid rgba(var(--c), 0.4); box-shadow: 0 0 26px -12px rgba(var(--c), .8);
                   transition: transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s ease; white-space: nowrap; }
        .am-node:hover { transform: translate(-50%, -50%) translateY(-2px); box-shadow: 0 14px 34px -14px rgba(var(--c), .9); }
        .am-node.master { padding: 12px 18px 12px 12px; --c: 67,120,255; }
        .am-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: rgb(var(--c)); box-shadow: 0 0 10px rgb(var(--c)); }
        .am-node.pending .am-dot { animation: am-blink 1.2s ease-in-out infinite; } @keyframes am-blink { 50% { opacity: .3; } }
        .am-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 15px; flex: none; color: rgb(var(--c)); background: rgba(var(--c), .12); border: 1px solid rgba(var(--c), .3); }
        .am-t { display: block; font: 700 12.5px/1.1 Geist, Inter, sans-serif; color: #fff; }
        .am-s { display: block; margin-top: 3px; font: 700 8.5px/1 'SFMono-Regular', Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; color: rgba(var(--c), .95); }
        .am-more { position: absolute; transform: translate(-50%, -50%); font-size: 11px; font-weight: 700; color: #8b94a5; }
        @media (max-width: 720px) { .am-node { padding: 7px 10px 7px 8px; gap: 7px; } .am-ic { width: 24px; height: 24px; font-size: 12px; } .am-t { font-size: 11px; } .am-s { font-size: 7.5px; } }
        @media (prefers-reduced-motion: reduce) { .am-ln.live, .am-node.pending .am-dot { animation: none; } }
        .glass-card { background: linear-gradient(180deg, rgba(17, 21, 28, 0.7) 0%, rgba(13, 16, 22, 0.9) 100%); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 24px; }
        .glass-item { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.03); border-radius: 16px; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .glow-text { text-shadow: 0 0 16px rgba(67, 120, 255, 0.4); }
        .module-strip-wrap { position: relative; }
        .module-strip-wrap::after { content: ''; position: absolute; top: 0; right: 0; bottom: 4px; width: 40px; background: linear-gradient(90deg, transparent, #080A0F); pointer-events: none; }

        /* Safety net -- mismo fix que las otras 24 páginas del Mobile Sweep:
           documentElement es el único nivel que contiene de verdad overflow
           horizontal (position:fixed no queda contenido por overflow de body). */
        html { overflow-x: hidden; }

        /* Sidebar mobile drawer -- estado base en CSS puro, sin depender del
           timing de mountSidebar()/requireSession() (ver
           _mountMobileSidebarToggle en nlt-shared.js). Causa raíz real de un
           overflow transitorio confirmado con un poll de 15ms: mientras
           mountSidebar() esperaba requireSession()+miSuscripcion() (~1s), el
           <aside id="sidebar"> quedaba como flex item estático de 280px --
           scrollWidth 539 vs viewport 375 durante toda esa ventana. Ahora
           nace ya fuera de pantalla desde el primer paint. */
        @media (max-width: 767px) {
            #sidebar { position: fixed; top: 0; bottom: 0; left: 0; z-index: 50; transform: translateX(-100%); transition: transform 300ms; }
            #sidebar.sidebar-open { transform: translateX(0); }
        }
        @media (prefers-reduced-motion: reduce) {
            #sidebar { transition: none; }
        }
    </style>

<body class="h-screen flex overflow-hidden">

         entonces el aside quedaba en flujo a 280px -> overflow horizontal
         transitorio (scrollWidth 539 en 375). _mountMobileSidebarToggle() solo
         agrega el botón/backdrop y togglea .sidebar-open. -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/nlt-shared.js?v=04fc06e7"></script>
    <script src="assets/js/nlt-api-client.js?v=36a041e6"></script>
    <script>
        const db = NLT.supabase;
        let sesionActual = null;
        let miSuscripcion = null; // { plan, status, max_accounts, cuentas_actuales, cuentas_disponibles } -- real, del backend

        async function cargarMetricas(subPreCargada) {
            // subPreCargada: /billing/subscription se pedía ACÁ y, por
            // separado, adentro de NLT.mountSidebar() (mismo endpoint, mismo
            // dato, dos round-trips reales por cada carga del dashboard --
            // confirmado real en el audit de rendimiento). init() la pide UNA
            // sola vez y la reparte entre los dos consumidores.
            miSuscripcion = subPreCargada;
            const limite = miSuscripcion ? miSuscripcion.max_accounts : 0;
            const usadas = miSuscripcion ? miSuscripcion.cuentas_actuales : 0;
            document.getElementById('metricCuentasUsadas').textContent = usadas;
            document.getElementById('metricCuentasLimite').textContent = limite;
            const labelEl = document.getElementById('userPlanLabel');
            if (labelEl) {
                labelEl.textContent = (miSuscripcion && miSuscripcion.plan && miSuscripcion.status === 'active') ? miSuscripcion.plan : 'Sin plan activo';
            }

            const inicioHoy = new Date();
            inicioHoy.setHours(0, 0, 0, 0);
            const { data: ops } = await db.from('historial_operaciones')
                .select('volumen, estado, profit, fecha_apertura')
                .eq('user_id', sesionActual.user.id)
                .gte('fecha_apertura', inicioHoy.toISOString());

            const volumenHoy = (ops || []).reduce((sum, op) => sum + Number(op.volumen), 0);
            _mapaState.opsHoy = (ops || []).length; renderMapaCuentas();
            document.getElementById('metricVolumen').textContent = volumenHoy > 0 ? volumenHoy.toFixed(2) : '—';
            document.getElementById('metricVolumenNota').textContent = volumenHoy > 0
                ? `${(ops || []).length} operaciones copiadas hoy`
                : 'Sin operaciones copiadas hoy todavía';

            const cerradas = (ops || []).filter(op => op.estado === 'CERRADA' && op.profit !== null);
            if (cerradas.length > 0) {
                const ganadoras = cerradas.filter(op => Number(op.profit) > 0).length;
                const tasa = (ganadoras / cerradas.length) * 100;
                document.getElementById('metricTasaExito').textContent = tasa.toFixed(1) + '%';
                document.getElementById('metricTasaExitoNota').textContent = `${ganadoras}/${cerradas.length} operaciones ganadoras hoy`;
            } else {
                document.getElementById('metricTasaExito').textContent = '—';
                document.getElementById('metricTasaExitoNota').textContent = 'Sin operaciones cerradas todavía';
            }
            document.querySelectorAll('[data-skel]').forEach((e) => e.removeAttribute('data-skel'));
        }

        // Antes esto no se mostraba en ningún lado del Dashboard -- una cuenta
        // podía quedar SESION_FRIA días sin que nadie la notara, salvo que el
        // usuario entrara puntualmente a Cuentas/Maestra y mirara el badge de
        // cada tarjeta. Ahora es lo primero que se ve al loguearse.
        // Mapa de cuentas: la maestra al centro-izquierda y tus destinos como nodos con el color de su estado REAL.
        // Los puntos de luz solo viajan cuando hay copias reales hoy (historial_operaciones) y ambas puntas estan conectadas.
        const _mapaState = { cuentas: null, opsHoy: null };
        const _ESTADO_MAPA = {
            CONECTADA: ['34,197,94', 'Conectada'], PENDIENTE: ['234,179,8', 'En cola'], CONNECTING: ['234,179,8', 'Conectando'],
            SESION_FRIA: ['251,146,60', 'Reconectar'], DESCONECTADA: ['248,113,113', 'Desconectada'], ERROR_CONEXION: ['248,113,113', 'Error'],
            CREDENCIALES_INVALIDAS: ['248,113,113', 'Credenciales'], TRADING_DISABLED: ['248,113,113', 'Trading off'],
        };
        function renderMapaCuentas() {
            const box = document.getElementById('accountMapWidget');
            const cuentas = _mapaState.cuentas;
            if (!box || !Array.isArray(cuentas)) return;
            const maestra = cuentas.find((c) => c.tipo_cuenta === 'MAESTRA');
            const destinos = cuentas.filter((c) => c.tipo_cuenta === 'DESTINO');
            if (!maestra && !destinos.length) { box.innerHTML = ''; return; }
            const MAX = 7, shown = destinos.slice(0, MAX), extra = destinos.length - shown.length;
            const slots = Math.max(1, shown.length) + (extra > 0 ? 1 : 0);
            const H = Math.max(150, slots * 64 + 28), W = 900, mx = 13, dx = 84;   // porcentajes horizontales
            const ys = Array.from({ length: slots }, (_, i) => (H / slots) * (i + 0.5));
            const masc = (n) => (n == null ? '' : '••' + String(n).slice(-4));
            const inf = (c) => _ESTADO_MAPA[c && c.estado] || ['248,113,113', (c && c.estado) || 'Desconocido'];
            const hayCopias = (_mapaState.opsHoy || 0) > 0;
            const mOk = maestra && maestra.estado === 'CONECTADA';
            const lines = shown.map((d, i) => {
                const [rgb] = inf(d), live = hayCopias && mOk && d.estado === 'CONECTADA';
                const x0 = (mx / 100) * W, x1 = (dx / 100) * W, y0 = H / 2, y1 = ys[i];
                const path = `M${x0},${y0} C${(x0 + x1) / 2},${y0} ${(x0 + x1) / 2},${y1} ${x1},${y1}`;
                return `<path class="am-ln${live ? ' live' : ''}" stroke="rgb(${rgb})" d="${path}"/>` +
                    (live ? `<circle r="2.6" fill="rgb(${rgb})" style="filter:drop-shadow(0 0 5px rgb(${rgb}))"><animateMotion dur="${(2.2 + (i % 3) * 0.5).toFixed(1)}s" begin="${(i * 0.35).toFixed(2)}s" repeatCount="indefinite" path="${path}"/></circle>` : '');
            }).join('');
            const nodoM = maestra ? (() => { const [rgb, tx] = inf(maestra); return `<a href="maestra.html" class="am-node master${maestra.estado === 'PENDIENTE' || maestra.estado === 'CONNECTING' ? ' pending' : ''}" style="left:${mx}%;top:${H / 2}px;--c:${rgb}" title="Cuenta maestra ${masc(maestra.login_numero)} - ${tx}"><span class="am-ic"><i class="ph-fill ph-crown"></i></span><span><span class="am-t">Maestra ${masc(maestra.login_numero)}</span><span class="am-s">${tx}</span></span></a>`; })()
                : `<a href="maestra.html" class="am-node master" style="left:${mx}%;top:${H / 2}px;--c:148,163,184"><span class="am-ic"><i class="ph ph-plus"></i></span><span><span class="am-t">Conecta tu maestra</span><span class="am-s">Pendiente</span></span></a>`;
            const nodosD = shown.map((d, i) => { const [rgb, tx] = inf(d); return `<a href="cuentas.html" class="am-node${d.estado === 'PENDIENTE' || d.estado === 'CONNECTING' ? ' pending' : ''}" style="left:${dx}%;top:${ys[i]}px;--c:${rgb}" title="Destino ${masc(d.login_numero)} - ${tx}"><span class="am-ic"><i class="ph-fill ph-user"></i></span><span><span class="am-t">Destino ${masc(d.login_numero)}</span><span class="am-s">${tx}</span></span></a>`; }).join('');
            const mas = extra > 0 ? `<a href="cuentas.html" class="am-more" style="left:${dx}%;top:${ys[slots - 1]}px">+${extra} más</a>` : '';
            const vacio = !destinos.length ? `<a href="#copierForm" class="am-node" style="left:${dx}%;top:${H / 2}px;--c:148,163,184"><span class="am-ic"><i class="ph ph-plus"></i></span><span><span class="am-t">Añade un destino</span><span class="am-s">Pendiente</span></span></a>` : '';
            box.innerHTML = `
                <div class="glass-card am p-5 md:p-7" style="--card-glow-rgb:34,211,238">
                    <div class="flex items-center justify-between gap-4 mb-2 flex-wrap">
                        <div><p class="text-[10px] font-bold uppercase tracking-widest mb-1" style="color:rgb(34,211,238)">Tus cuentas</p><h3 class="text-lg font-bold text-white">Mapa de copiado</h3></div>
                        <p class="text-[11px] text-gray-500">${hayCopias ? 'Los puntos de luz indican copias reales de hoy.' : 'Sin copias hoy: las líneas se activan cuando la maestra opere.'}</p>
                    </div>
                    <div class="am-stage" style="height:${H}px">
                        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${lines}</svg>
                        ${nodoM}${nodosD}${vacio}${mas}
                    </div>
                </div>`;
        }

        // Primeros pasos: una lista guiada mientras falte conectar la maestra, un destino o
        // reconectar una cuenta. Sale de los datos reales (listarCuentas) y desaparece sola al completarse.
        function renderPrimerosPasos(cuentas, sub) {
            const box = document.getElementById('onboardingWidget');
            if (!box) return;
            const lista = Array.isArray(cuentas) ? cuentas : [];
            const hayMaestra = lista.some((c) => c.tipo_cuenta === 'MAESTRA');
            const hayDestino = lista.some((c) => c.tipo_cuenta === 'DESTINO');
            const frias = lista.some((c) => c.estado === 'SESION_FRIA' || c.estado === 'DESCONECTADA');
            const pasos = [];
            if (sub && sub.status && sub.status !== 'active') pasos.push({ c: '168,85,247', icon: 'ph-credit-card', t: 'Elige tu plan', d: 'Activa un plan para conectar tus cuentas.', href: 'suscripcion.html', ok: false });
            pasos.push({ c: '67,120,255', icon: 'ph-crown', t: 'Conecta tu cuenta maestra', d: 'La cuenta que operas: MT5, sin instalar nada.', href: 'maestra.html', ok: hayMaestra });
            pasos.push({ c: '34,211,238', icon: 'ph-users', t: 'Añade una cuenta destino', d: 'Cada destino se suma con su propio balance y multiplicador.', href: '#copierForm', ok: hayDestino });
            pasos.push({ c: '34,197,94', icon: 'ph-check-circle', t: 'Verifica la conexión', d: 'Todas tus cuentas conectadas y listas para copiar.', href: 'cuentas.html', ok: hayMaestra && hayDestino && !frias });
            const hechos = pasos.filter((s) => s.ok).length;
            if (hechos === pasos.length) { box.innerHTML = ''; return; }
            box.innerHTML = `
                <div class="glass-card p-5 md:p-7" style="--card-glow-rgb:67,120,255">
                    <div class="flex items-center justify-between gap-4 mb-4">
                        <div><p class="text-[10px] font-bold text-nlt-accent uppercase tracking-widest mb-1">Primeros pasos</p><h3 class="text-lg font-bold text-white">Deja tu copiador listo</h3></div>
                        <span class="text-xs font-bold text-gray-400 shrink-0">${hechos} / ${pasos.length}</span>
                    </div>
                    <div class="ob-bar mb-5"><i style="--w:${Math.round((hechos / pasos.length) * 100)}%"></i></div>
                    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:10px">
                        ${pasos.map((s, i) => `
                            <a href="${s.href}" class="ob-step${s.ok ? ' done' : ''}" style="--c:${s.c}">
                                <span class="ob-num">${s.ok ? '<i class="ph-bold ph-check"></i>' : i + 1}</span>
                                <span class="min-w-0"><span class="block text-sm font-semibold text-white">${s.t}</span><span class="block text-[11px] text-gray-500 leading-snug">${s.d}</span></span>
                            </a>`).join('')}
                    </div>
                </div>`;
        }

        // Checklist de bienvenida: 4 pasos elegidos por el usuario (conectar
        // MT5, activar notificaciones, explorar Prop Hub, probar una
        // herramienta gratis). Distinto de "Primeros pasos" de arriba (eso es
        // específico del setup del copiador) -- este es el recorrido general
        // del ecosistema para una cuenta nueva. Se puede minimizar (queda un
        // botón chico) pero reaparece en la próxima visita hasta completarse.
        const WELCOME_CHECKLIST_MIN_KEY = 'nlt_welcome_checklist_min';
        let _welcomeEstadoCache = null;

        function renderChecklistBienvenida(estadoBackend) {
            const box = document.getElementById('welcomeChecklistWidget');
            if (!box) return;
            let propHubVisitado = false;
            try { propHubVisitado = localStorage.getItem('nlt_prop_hub_visitado') === '1'; } catch (_) { /* sin storage */ }

            const pasos = [
                { c: '67,120,255', t: 'Conecta tu cuenta de MT5', d: 'Sincroniza tu cuenta real o demo para empezar a copiar.', href: 'maestra.html', ok: !!estadoBackend.mt5_conectado },
                { c: '234,179,8', t: 'Activa las notificaciones', d: 'Señales, pagos y operaciones copiadas, al instante.', href: 'configuracion.html', ok: !!estadoBackend.notificaciones_activas },
                { c: '168,85,247', t: 'Explora Prop Hub', d: 'Compara prop firms externas y sus descuentos NLT.', href: 'funded.html', ok: propHubVisitado },
                { c: '34,197,94', t: 'Prueba una herramienta gratis', d: 'Calculadora de riesgo, noticias en vivo y más.', href: 'tools.html', ok: !!estadoBackend.herramienta_probada },
            ];
            const hechos = pasos.filter((s) => s.ok).length;
            if (hechos === pasos.length) {
                box.innerHTML = '';
                try { localStorage.removeItem(WELCOME_CHECKLIST_MIN_KEY); } catch (_) { /* noop */ }
                return;
            }

            let minimizado = false;
            try { minimizado = localStorage.getItem(WELCOME_CHECKLIST_MIN_KEY) === '1'; } catch (_) { /* noop */ }

            if (minimizado) {
                box.innerHTML = `
                    <button type="button" id="btnExpandirBienvenida" class="w-full glass-card p-4 flex items-center justify-between gap-4 text-left hover:border-white/10 transition-colors" style="--card-glow-rgb:67,120,255">
                        <div class="flex items-center gap-3">
                            <span class="w-9 h-9 rounded-full grid place-items-center shrink-0" style="background:rgba(67,120,255,.12); border:1px solid rgba(67,120,255,.3); color:rgb(67,120,255)"><i class="ph-fill ph-hand-waving"></i></span>
                            <span><span class="block text-sm font-semibold text-white">Termina de configurar tu cuenta</span><span class="block text-[11px] text-gray-500">${hechos} de ${pasos.length} pasos completados</span></span>
                        </div>
                        <i class="ph-bold ph-caret-down text-gray-500"></i>
                    </button>`;
                document.getElementById('btnExpandirBienvenida').addEventListener('click', () => {
                    try { localStorage.removeItem(WELCOME_CHECKLIST_MIN_KEY); } catch (_) { /* noop */ }
                    renderChecklistBienvenida(estadoBackend);
                });
                return;
            }

            box.innerHTML = `
                <div class="glass-card p-5 md:p-7" style="--card-glow-rgb:67,120,255">
                    <div class="flex items-center justify-between gap-4 mb-4">
                        <div><p class="text-[10px] font-bold text-nlt-accent uppercase tracking-widest mb-1">Bienvenida</p><h3 class="text-lg font-bold text-white">Saca el máximo provecho a NLT</h3></div>
                        <div class="flex items-center gap-3 shrink-0">
                            <span class="text-xs font-bold text-gray-400">${hechos} / ${pasos.length}</span>
                            <button type="button" id="btnMinimizarBienvenida" title="Minimizar" class="w-7 h-7 rounded-lg grid place-items-center text-gray-500 hover:text-white hover:bg-white/5 transition-colors"><i class="ph-bold ph-minus"></i></button>
                        </div>
                    </div>
                    <div class="ob-bar mb-5"><i style="--w:${Math.round((hechos / pasos.length) * 100)}%"></i></div>
                    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:10px">
                        ${pasos.map((s, i) => `
                            <a href="${s.href}" class="ob-step${s.ok ? ' done' : ''}" style="--c:${s.c}">
                                <span class="ob-num">${s.ok ? '<i class="ph-bold ph-check"></i>' : i + 1}</span>
                                <span class="min-w-0"><span class="block text-sm font-semibold text-white">${s.t}</span><span class="block text-[11px] text-gray-500 leading-snug">${s.d}</span></span>
                            </a>`).join('')}
                    </div>
                </div>`;
            document.getElementById('btnMinimizarBienvenida').addEventListener('click', () => {
                try { localStorage.setItem(WELCOME_CHECKLIST_MIN_KEY, '1'); } catch (_) { /* noop */ }
                renderChecklistBienvenida(estadoBackend);
            });
        }

        async function cargarChecklistBienvenida() {
            const box = document.getElementById('welcomeChecklistWidget');
            try {
                _welcomeEstadoCache = await NLT_API.onboardingEstado();
                renderChecklistBienvenida(_welcomeEstadoCache);
            } catch (err) {
                console.error('No se pudo cargar el checklist de bienvenida:', err);
                if (box) box.innerHTML = '';
            }
        }

        async function cargarAlertaConexion() {
            const box = document.getElementById('connectionAlertWidget');
            try {
                const cuentas = await NLT_API.listarCuentas();
                renderPrimerosPasos(cuentas, miSuscripcion);
                _mapaState.cuentas = cuentas; renderMapaCuentas();
                const frias = (cuentas || []).filter(c => c.proveedor === 'TICKERALL' && (c.estado === 'SESION_FRIA' || c.estado === 'DESCONECTADA'));
                if (!frias.length) {
                    box.innerHTML = '';
                    return;
                }
                const items = frias.map(c => {
                    const href = c.tipo_cuenta === 'MAESTRA' ? 'maestra.html' : 'cuentas.html';
                    const etiqueta = c.tipo_cuenta === 'MAESTRA' ? 'Maestra' : 'Destino';
                    return `<a href="${href}" class="flex items-center justify-between gap-2 px-3 py-2 rounded-lg bg-black/20 hover:bg-black/30 transition-colors">
                        <span class="text-xs text-gray-300"><span class="font-semibold text-white">${etiqueta}</span> · Login ${c.login_numero}</span>
                        <span class="text-[11px] font-semibold text-orange-400 flex items-center gap-1">Reconectar <i class="ph-bold ph-arrow-right"></i></span>
                    </a>`;
                }).join('');
                box.innerHTML = `
                <div class="glass-card p-4 md:p-6 border-orange-500/20">
                    <div class="flex items-center gap-4 mb-3">
                        <div class="w-10 h-10 md:w-11 md:h-11 rounded-full bg-orange-500/10 flex items-center justify-center text-orange-400 shrink-0"><i class="ph-fill ph-plugs text-lg md:text-xl"></i></div>
                        <div>
                            <p class="text-[11px] font-bold text-orange-400 uppercase tracking-wider mb-0.5">Reconexión necesaria</p>
                            <p class="text-sm text-white font-semibold">${frias.length} cuenta${frias.length === 1 ? '' : 's'} con la sesión enfriada del lado del broker -- el copiador no puede operarla${frias.length === 1 ? '' : 's'} hasta que la${frias.length === 1 ? '' : 's'} reconectes.</p>
                        </div>
                    </div>
                    <div class="space-y-2">${items}</div>
                </div>`;
            } catch (err) {
                console.error('No se pudo chequear el estado de conexión de las cuentas:', err);
                box.innerHTML = '';
            }
        }

        function fmtCountdownWidget(mins) {
            if (mins < 0) return null;
            const h = Math.floor(mins / 60), m = mins % 60;
            if (h > 24) return `en ${Math.floor(h / 24)}d`;
            return h > 0 ? `⏱ ${h}h ${m}min` : `⏱ ${m} min`;
        }

        let _nextHighImpactTs = null;

        async function cargarMarketAlerts() {
            const box = document.getElementById('marketAlertsWidget');
            try {
                const [next, hoy, status] = await Promise.all([
                    NLT_API.calendarProximoAltoImpacto(),
                    NLT_API.calendarEventos({ from: new Date().toISOString().slice(0, 10), to: new Date().toISOString().slice(0, 10) }),
                    NLT_API.calendarStatus(),
                ]);
                const altoImpactoHoy = (hoy || []).filter(e => e.impact === 'HIGH').length;
                _nextHighImpactTs = next ? new Date(next.event_time_utc).getTime() : null;
                const fuenteTag = status && status.using_mock
                    ? '<span class="text-[9px] text-amber-500 font-bold ml-2">DEMO DATA</span>'
                    : '<span class="text-[9px] text-nlt-success font-bold ml-2">LIVE</span>';

                box.innerHTML = `
                <div class="glass-card p-4 md:p-6 flex items-center justify-between gap-4 flex-wrap">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 md:w-11 md:h-11 rounded-full bg-red-500/10 flex items-center justify-center text-red-400 shrink-0"><i class="ph-fill ph-megaphone text-lg md:text-xl"></i></div>
                        <div>
                            <p class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-0.5">NLT Market Alerts ${fuenteTag}</p>
                            ${next
                                ? `<p class="text-sm text-white font-semibold">${next.event_name} <span class="text-gray-500 font-normal">(${next.currency || ''})</span> <span id="marketAlertCountdown" class="text-nlt-accent font-bold ml-1">${fmtCountdownWidget(Math.round((_nextHighImpactTs - Date.now()) / 60000)) || ''}</span></p>`
                                : `<p class="text-sm text-gray-500">Sin eventos de alto impacto próximos.</p>`
                            }
                            <p class="text-[11px] text-gray-600 mt-0.5">${altoImpactoHoy} evento${altoImpactoHoy === 1 ? '' : 's'} de alto impacto hoy</p>
                        </div>
                    </div>
                    <a href="news.html#calendario" class="text-xs font-semibold text-nlt-accent hover:underline shrink-0">Ver Calendario →</a>
                </div>`;
            } catch (err) {
                console.error('No se pudo cargar NLT Market Alerts:', err);
                box.innerHTML = `<div class="glass-card p-5 text-xs text-gray-500 flex items-center gap-2"><i class="ph ph-cloud-warning text-amber-500"></i> Calendar temporarily unavailable</div>`;
            }
        }
        // El texto solo muestra minutos/horas (fmtCountdownWidget), nunca
        // segundos -- refrescarlo cada 1s recalculaba y reescribía el DOM
        // 60 veces por cada vez que el texto realmente cambiaba. 30s alcanza
        // de sobra para que se sienta "en vivo", y se pausa solo si la
        // pestaña queda en segundo plano.
        NLT.pollWhileVisible(() => {
            const el = document.getElementById('marketAlertCountdown');
            if (el && _nextHighImpactTs) el.textContent = fmtCountdownWidget(Math.round((_nextHighImpactTs - Date.now()) / 60000)) || '';
        }, 30000);

        async function init() {
            sesionActual = await NLT.requireSession();
            if (!sesionActual) return;

            document.getElementById('moduleStrip').innerHTML = NLT.renderModuleStrip('copy');

            // /billing/subscription se pide UNA sola vez acá (antes mountSidebar
            // y cargarMetricas la pedían cada uno por su lado -- 2 round-trips
            // reales al mismo endpoint en cada carga del dashboard, confirmado
            // real en el audit de rendimiento) y se reparte a ambos consumidores.
            let subscripcion = null;
            try {
                subscripcion = await NLT_API.miSuscripcion();
            } catch (err) {
                console.error('Error cargando suscripción:', err);
            }
            const planLabel = (subscripcion && subscripcion.plan && subscripcion.status === 'active') ? subscripcion.plan : 'Sin plan activo';

            // Estas 5 llamadas tocan zonas de DOM y endpoints independientes
            // entre sí -- antes se esperaban una por una (varios round-trips en
            // serie), lo que sumaba toda su latencia de red en vez de solo
            // la del más lento. En paralelo, todas corren a la vez.
            await Promise.all([
                NLT.mountSidebar(sesionActual, { activo: 'dashboard', seccion: 'cfd', planLabel }),
                NLT.ensurePerfil(sesionActual),
                cargarMetricas(subscripcion),
                cargarMarketAlerts(),
                cargarAlertaConexion(),
                cargarChecklistBienvenida(),
            ]);
            NLT.registerPaletteAction({ label: 'Ver el tour del dashboard', icon: 'ph-compass', rgb: '67,120,255', kw: 'ayuda guia recorrido tutorial', run: () => iniciarTour(true) });
            setTimeout(() => iniciarTour(false), 1400);   // solo la primera vez (localStorage)
        }

        // Tour de primer uso: sidebar, buscador, barra de modulos, metricas y (si aplica) primeros pasos / mapa.
        function iniciarTour(forzar) {
            const conPasos = document.querySelector('#onboardingWidget .glass-card') ? '#onboardingWidget .glass-card' : (document.querySelector('#accountMapWidget .glass-card') ? '#accountMapWidget .glass-card' : '#copierForm');
            NLT.startTour([
                { sel: '#sidebar nav', title: 'Todo NLT en un menú', text: 'Cada sección tiene su propio color, igual que los productos del ecosistema.' },
                { sel: '[data-nlt-palette]', title: 'Busca lo que sea', text: 'Pulsa Ctrl+K (o ⌘K) para ir a cualquier sección. Con la tecla ? ves todos los atajos.' },
                { sel: '#moduleStrip', title: 'Salta entre productos', text: 'Copy System, Indicator, calculadoras, noticias y más, a un clic desde aquí.' },
                { sel: '#metricsRow', title: 'Tu día, de un vistazo', text: 'Volumen copiado, cuentas conectadas y tasa de éxito. Los números se cargan de tus datos reales.' },
                { sel: conPasos, title: conPasos === '#copierForm' ? 'Añade una cuenta destino' : 'Tu siguiente paso', text: conPasos === '#copierForm' ? 'Conecta una cuenta destino para empezar a copiar.' : 'Aquí ves qué te falta para dejar el copiador listo y el estado de cada cuenta.' },
            ], { key: 'dashboard-v1', force: !!forzar });
        }

        NLT.injectServerDatalist();
        document.getElementById('marketToggle').innerHTML = NLT.marketTypeToggleHTML('cfd');

        // Evento para Agregar Cuenta Destino
        document.getElementById('copierForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgBox = document.getElementById('statusMsg');
            msgBox.classList.remove('hidden');
            msgBox.className = "mt-3 text-center text-xs p-2 rounded-lg bg-blue-500/10 text-blue-400 border border-blue-500/20";
            msgBox.textContent = "Verificando conexión...";

            try {
                const login = document.getElementById('login').value;
                const password = document.getElementById('password').value;
                const server = document.getElementById('server').value;
                const proveedor = document.getElementById('proveedor').value;

                if (!sesionActual) {
                    msgBox.className = "mt-3 text-center text-xs p-2 rounded-lg bg-nlt-danger/10 text-nlt-danger border border-nlt-danger/20";
                    msgBox.textContent = "❌ Error: Sesión expirada.";
                    return;
                }

                // Aviso rápido en el cliente con el dato real ya cargado (mejor UX),
                // pero quien de verdad lo impide es el backend (ver NLT_API
                // app/services/account_limits.py) -- esto es solo un atajo visual.
                if (miSuscripcion && miSuscripcion.cuentas_actuales >= miSuscripcion.max_accounts) {
                    msgBox.className = "mt-3 text-center text-xs p-2 rounded-lg bg-nlt-danger/10 text-nlt-danger border border-nlt-danger/20";
                    msgBox.textContent = "❌ Límite de cuentas de tu plan alcanzado. Mejora tu plan en Suscripción.";
                    return;
                }

                msgBox.textContent = proveedor === 'tickerall' ? "Conectando vía TickerAll (puede tardar ~1 min)..." : "Sincronizando cuenta...";

                const datos = {
                    tipo_cuenta: 'DESTINO',
                    login_numero: parseInt(login),
                    password: password,
                    broker_server: server,
                    riesgo_porcentaje: 1.0,
                };

                if (proveedor === 'tickerall') {
                    await NLT_API.crearCuentaTickerAll(datos);
                } else {
                    await NLT_API.crearCuentaLocal(datos);
                }

                msgBox.className = "mt-3 text-center text-xs p-2 rounded-lg bg-nlt-success/10 text-nlt-success border border-nlt-success/20";
                msgBox.textContent = "✅ Cuenta conectada.";
                document.getElementById('copierForm').reset();
                await cargarMetricas();
                await cargarChecklistBienvenida();
            } catch (err) {
                msgBox.className = "mt-3 text-center text-xs p-2 rounded-lg bg-nlt-danger/10 text-nlt-danger border border-nlt-danger/20";
                msgBox.textContent = "❌ Error crítico: " + err.message;
            }
        });

        init();
        setTimeout(() => document.querySelectorAll('[data-skel]').forEach((e) => e.removeAttribute('data-skel')), 9000);
        // Se pausan solos si la pestaña queda en segundo plano, y refrescan
        // una vez de inmediato al volver a primer plano.
        NLT.pollWhileVisible(() => { if (sesionActual) cargarMetricas(); }, 20000);
        NLT.pollWhileVisible(() => { if (sesionActual) cargarMarketAlerts(); }, 60000);
        NLT.pollWhileVisible(() => { if (sesionActual) cargarAlertaConexion(); }, 60000);
        NLT.pollWhileVisible(() => { if (sesionActual) cargarChecklistBienvenida(); }, 60000);
    </script>
</body>
</html>
