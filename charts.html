    <style>
        :root { --ch-accent: 34,211,238; --ch-line: rgba(255,255,255,0.06); }
        html, body { height: 100%; overflow: hidden; }
        body { background: #080A0F; color: #fff; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }

        #chMain { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
        .ch-toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--ch-line); min-height: 56px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
        .ch-toolbar::-webkit-scrollbar { display: none; }
        .ch-select { background: rgba(255,255,255,0.04); border: 1px solid var(--ch-line); border-radius: 10px; color: #fff; font-size: 13px; font-weight: 600; padding: 7px 10px; flex-shrink: 0; }
        .ch-select:focus { outline: none; border-color: rgb(var(--ch-accent)); }
        .ch-select option, .ch-select optgroup { background: #0D1016; }
        .ch-tfs { display: flex; gap: 2px; background: rgba(255,255,255,0.03); border: 1px solid var(--ch-line); border-radius: 10px; padding: 2px; flex-shrink: 0; }
        .ch-tf { font-size: 12px; font-weight: 600; color: #9CA3AF; padding: 5px 9px; border-radius: 8px; cursor: pointer; }
        .ch-tf:hover { color: #fff; }
        .ch-tf.on { background: rgba(var(--ch-accent),0.14); color: rgb(var(--ch-accent)); }
        .ch-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #D1D5DB; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--ch-line); background: rgba(255,255,255,0.03); cursor: pointer; flex-shrink: 0; }
        .ch-btn:hover { color: #fff; border-color: rgba(255,255,255,0.14); }
        .ch-btn i { font-size: 16px; }
        .ch-btn-label { display: none; }
        .ch-conn { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: #9CA3AF; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--ch-line); white-space: nowrap; flex-shrink: 0; cursor: help; }
        .ch-conn i { width: 7px; height: 7px; border-radius: 50%; background: #6B7280; }
        .ch-conn[data-estado="conectado"] i { background: #22C55E; box-shadow: 0 0 0 3px rgba(34,197,94,.18); }
        .ch-conn[data-estado="retrasado"] i, .ch-conn[data-estado="conectando"] i { background: #EAB308; }
        .ch-conn[data-estado="desconectado"] { color: #F87171; border-color: rgba(248,113,113,.35); }
        .ch-conn[data-estado="desconectado"] i { background: #EF4444; }
        .ch-demo { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: rgb(234,179,8); background: rgba(234,179,8,0.1); border: 1px solid rgba(234,179,8,0.3); padding: 4px 8px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; cursor: help; }

        .ch-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .ch-stage { position: relative; flex: 1; min-height: 0; min-width: 0; }
        #chart { position: absolute; inset: 0; }

        .ch-overlay.error { color: rgb(248,113,113); pointer-events: auto; }

        /* Herramientas de dibujo: columna a la izquierda en escritorio, barra abajo en celular */
        .ch-tools { display: flex; gap: 2px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid var(--ch-line); overflow-x: auto; scrollbar-width: none; order: 2; flex-shrink: 0; }
        .ch-tools::-webkit-scrollbar { display: none; }

        .ch-tool.on { color: rgb(var(--ch-accent)); background: rgba(var(--ch-accent),0.12); }
        .ch-tool.peligro:hover { color: rgb(248,113,113); }
        .ch-tool-sep { width: 1px; height: 24px; align-self: center; background: var(--ch-line); margin: 0 4px; flex-shrink: 0; }
        .ch-hint { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); font-size: 12px; color: #E5E7EB; background: rgba(13,16,22,0.92); border: 1px solid var(--ch-line); border-radius: 999px; padding: 6px 12px; pointer-events: none; white-space: nowrap; z-index: 5; }

        /* Panel de indicadores: hoja inferior en celular, panel flotante en escritorio */

        .ch-panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: 78vh; overflow-y: auto; background: #0D1016; border: 1px solid var(--ch-line); border-radius: 18px 18px 0 0; z-index: 71; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); }

        .ch-ind-name { font-size: 13px; font-weight: 600; }
        .ch-ind-desc { font-size: 11px; color: #6B7280; }

        .ch-pro-manual { border-top: 1px solid var(--ch-line); margin-top: 8px; padding-top: 10px; }
        .ch-lock { font-size: 10px; font-weight: 700; letter-spacing: .06em; color: rgb(168,85,247); background: rgba(168,85,247,0.1); border: 1px solid rgba(168,85,247,0.3); padding: 2px 7px; border-radius: 999px; }

        /* Engranaje por indicador */

        .ch-ind-buscar { display: block; width: 100%; margin: 0 0 6px; box-sizing: border-box; }

        /* Diálogo de configuración (estilo TradingView) */
        .cs-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 80; }
        .cs-modal { position: fixed; z-index: 81; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100vw - 24px)); max-height: min(720px, calc(100vh - 32px)); display: flex; flex-direction: column; background: #131722; border: 1px solid #2A2E39; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); color: #D1D4DC; font-size: 13px; }
        .cs-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; }
        .cs-titulo { font-size: 16px; font-weight: 700; color: #fff; }
        .cs-tabs { display: flex; gap: 16px; padding: 0 16px; border-bottom: 1px solid #2A2E39; }
        .cs-tab { padding: 8px 0; font-weight: 600; color: #787B86; }
        .cs-tab.on { color: #fff; box-shadow: inset 0 -2px 0 #2962FF; }
        .cs-cuerpo { overflow-y: auto; padding: 8px 16px 16px; }
        .cs-grupo { padding-top: 10px; }
        .cs-grupo-t { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #787B86; margin: 6px 0 8px; }
        .cs-fila { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
        .cs-fila.cs-inline { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
        .cs-campo { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .cs-inline .cs-campo { justify-content: flex-start; }
        .cs-label { color: #D1D4DC; }
        .cs-label i { color: #787B86; font-size: 12px; }
        .cs-bool { justify-content: flex-start; cursor: pointer; }
        .cs-bool input { width: 16px; height: 16px; accent-color: #2962FF; }
        .cs-num, .cs-sel, .cs-sesion input { background: #1E222D; border: 1px solid #363A45; border-radius: 6px; color: #fff; padding: 6px 8px; font-size: 13px; }
        .cs-num { width: 110px; text-align: right; }
        .cs-sel { min-width: 140px; }
        .cs-num:focus, .cs-sel:focus, .cs-sesion input:focus { outline: none; border-color: #2962FF; }
        .cs-sesion { display: inline-flex; align-items: center; gap: 6px; color: #787B86; }
        .cs-sesion input { color-scheme: dark; }
        .cs-color-in { display: inline-flex; align-items: center; gap: 6px; }
        .cs-color-in input[type=color] { width: 28px; height: 24px; padding: 0; border: 1px solid #363A45; border-radius: 5px; background: none; cursor: pointer; }
        .cs-color-in input[type=range] { width: 70px; accent-color: #2962FF; }
        .cs-pie { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid #2A2E39; }
        .cs-ok { background: #2962FF; border-color: #2962FF; color: #fff; }
        .cs-ok:hover { background: #1E53E5; color: #fff; }

        /* Dashboards de la Unified Suite (tablas de TradingView) */
        .ud-host { position: absolute; pointer-events: none; z-index: 4; overflow: hidden; }
        .ud-esq { position: absolute; display: flex; flex-direction: column; gap: 6px; max-width: 46%; }
        .ud-esq[data-pos="Top Left"] { top: 44px; left: 8px; }
        .ud-esq[data-pos="Top Right"] { top: 8px; right: 8px; align-items: flex-end; }
        .ud-esq[data-pos="Bottom Left"] { bottom: 8px; left: 8px; }
        .ud-esq[data-pos="Bottom Right"] { bottom: 8px; right: 8px; align-items: flex-end; }
        .ud-dash { pointer-events: auto; cursor: pointer; }
        /* Tablas del NLT Zone Engine V13.4 (table.new): tamaños = size.tiny/small/normal/large de Pine */
        .ze-tabla { border-collapse: collapse; font: 11px/1.3 Inter, system-ui, sans-serif; min-width: 250px; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
        .ze-tabla td { padding: 3px 8px; white-space: pre; vertical-align: middle; }
        .ze-tabla .ze-v { text-align: right; font-weight: 600; }
        .ze-tabla .ze-l { font-size: 11px; }
        .ze-tabla .ze-tiny { font-size: 9.5px; } .ze-tabla .ze-small { font-size: 11px; } .ze-tabla .ze-normal { font-size: 12.5px; } .ze-tabla .ze-large { font-size: 15px; }
        .ze-tabla .ze-hdr td { font-weight: 700; letter-spacing: .02em; padding: 5px 8px; cursor: pointer; }
        .ze-tabla .ze-div td { padding: 0 8px; font-size: 7px; line-height: 9px; color: rgba(54,58,69,.8); overflow: hidden; }
        .ze-tabla .ze-exp td { cursor: pointer; font-weight: 600; }
        .ze-tabla.ze-min tr:not(.ze-hdr) { display: none; }
        .ze-tabla.ze-esc-small { zoom: .88; } .ze-tabla.ze-esc-large { zoom: 1.15; }
        .ze-tabla.ze-nlt { min-width: 0; background: rgba(13,16,22,.92); border: 1px solid rgba(67,120,255,.45); }
        .ze-tabla.ze-nlt td { text-align: left; }
        @media (max-width: 767px) { .ze-tabla { min-width: 0; font-size: 9.5px; } .ze-tabla td { padding: 2px 5px; } }
        /* Minimizado: solo la primera fila (el título) */
        .ud-dash.ud-min tr:not(:first-child) { display: none; }
        .ud-dash.ud-min .ud-pre { max-height: 1.6em; overflow: hidden; }
        .ud-tabla { border-collapse: collapse; font-size: 11px; line-height: 1.35; }
        .ud-tabla td, .ud-tabla th { padding: 3px 8px; white-space: nowrap; }
        .ud-sr { background: rgba(17,19,26,.95); border: 1px solid rgba(43,48,64,.5); }
        .ud-sr th { background: rgba(30,34,45,.9); color: #fff; font-weight: 600; text-align: center; }
        .ud-sr td { border: 1px solid rgba(43,48,64,.5); color: #C0C0C0; }
        .ud-sr td + td { text-align: right; }
        .ud-pre { margin: 0; padding: 6px 8px; font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: rgba(255,255,255,.95); background: rgba(13,17,23,.85); border: 1px solid rgba(255,215,0,.6); }
        .ud-smc-t { background: rgba(10,10,10,.94); border: 1px solid rgba(138,43,226,.12); }

        .ud-smc-t .ud-titulo { color: #fff; text-align: center; font-size: 15px; font-weight: 700; }
        .ud-smc-t .ud-sub { color: #7A7A7A; text-align: center; font-size: 11px; }
        .ud-smc-t .ud-muted { color: #7A7A7A; }
        .ud-sz-s { font-size: 11px; } .ud-sz-n { font-size: 13px; } .ud-sz-l { font-size: 16px; }
        .ud-sz-s .ud-titulo { font-size: 13px; } .ud-sz-l .ud-titulo { font-size: 20px; }
        @media (max-width: 767px) {
            .ud-tabla { font-size: 10px; } .ud-pre { font-size: 9.5px; }
            .ud-smc-t .ud-titulo { font-size: 12px; }
            .cs-num { width: 90px; } .cs-sel { min-width: 110px; }
        }
        /* Barra flotante del dibujo seleccionado (estilo TradingView) */
        .dw-bar { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 6; display: flex; align-items: center; gap: 4px; padding: 4px; background: #131722; border: 1px solid #2A2E39; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.45); max-width: calc(100% - 16px); overflow-x: auto; scrollbar-width: none; }
        .dw-bar::-webkit-scrollbar { display: none; }
        .dw-nombre { font-size: 11px; font-weight: 600; color: #9CA3AF; padding: 0 6px; white-space: nowrap; }
        .dw-btn { height: 30px; min-width: 30px; padding: 0 7px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; border-radius: 7px; color: #D1D4DC; font-size: 16px; cursor: pointer; flex-shrink: 0; }
        .dw-btn span { font-size: 11px; font-weight: 600; }
        .dw-btn:hover { background: rgba(255,255,255,.07); color: #fff; }
        .dw-btn.on { color: rgb(var(--ch-accent)); background: rgba(var(--ch-accent),.12); }
        .dw-btn.peligro:hover { color: rgb(248,113,113); }
        .dw-sel { background: #1E222D; border: 1px solid #363A45; border-radius: 6px; color: #fff; font-size: 12px; padding: 4px 6px; height: 30px; flex-shrink: 0; }
        .dw-color { position: relative; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 7px; cursor: pointer; flex-shrink: 0; }
        .dw-color:hover { background: rgba(255,255,255,.07); }
        .dw-color span { width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(255,255,255,.3); }
        .dw-color input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        /* Diálogo: pestañas como botones, texto libre, entradas de etapa 2 */
        .cs-tab { background: none; border: 0; cursor: pointer; font: inherit; }
        .cs-texto { background: #1E222D; border: 1px solid #363A45; border-radius: 6px; color: #fff; padding: 6px 8px; font-size: 13px; width: 100%; min-width: 180px; font-family: inherit; }
        .cs-texto:focus { outline: none; border-color: #2962FF; }
        .cs-col { flex-direction: column; align-items: stretch; }
        .cs-off { opacity: .5; }
        .cs-etapa2 { font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #A78BFA; border: 1px solid rgba(167,139,250,.4); border-radius: 999px; padding: 1px 6px; margin-left: 6px; }
        .cs-plantilla { min-width: 0; }
        /* Watchlist: columna a la derecha en escritorio, hoja inferior en celular */
        .ch-fav { padding: 7px 8px; }
        .ch-fav.on, .ch-fav.on i { color: #FACC15; }

        .wl[hidden] { display: none; }
        .wl-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 4px 14px; font-size: 13px; font-weight: 700; }
        .wl-sec { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #6B7280; margin: 10px 14px 4px; display: flex; gap: 5px; align-items: center; }
        .wl-sec i { color: #FACC15; }
        .wl-buscar { margin: 2px 10px 6px; background: #1E222D; border: 1px solid #363A45; border-radius: 8px; color: #fff; font-size: 12px; padding: 6px 9px; }
        .wl-buscar:focus { outline: none; border-color: rgb(var(--ch-accent)); }
        .wl-lista { display: flex; flex-direction: column; }
        .wl-fila { display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 12px; cursor: pointer; border-left: 2px solid transparent; }
        .wl-fila:hover { background: rgba(255,255,255,.03); }
        .wl-fila.on { background: rgba(var(--ch-accent),.08); border-left-color: rgb(var(--ch-accent)); }
        .wl-fila.arrastrando { opacity: .4; }
        .wl-fila.wl-nd { cursor: default; opacity: .5; }
