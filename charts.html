    <style>

        @media (prefers-reduced-motion: reduce) { .ch-btn.girando i { animation: none; } }
        .ch-conn { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: #9CA3AF; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--ch-line); white-space: nowrap; flex-shrink: 0; cursor: help; }

        .ch-conn[data-estado="retrasado"] i, .ch-conn[data-estado="conectando"] i { background: #EAB308; }

        /* Multi-gráfico y Comparar */

        .mc-body { position: absolute; left: 0; right: 0; top: 26px; bottom: 0; }

        .mc-fila button { background: none; border: 0; color: #6B7280; cursor: pointer; font-size: 13px; }
        .mc-add { display: flex; gap: 8px; margin-top: 8px; } .mc-add .mc-sel { flex: 1; height: 30px; }
        .ch-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }

        /* Herramientas de dibujo: columna a la izquierda en escritorio, barra abajo en celular */
        .ch-tools { display: flex; gap: 2px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid var(--ch-line); overflow-x: auto; scrollbar-width: none; order: 2; flex-shrink: 0; }
        .ch-tools::-webkit-scrollbar { display: none; }

        .ch-tool:hover { color: #fff; background: rgba(255,255,255,0.05); }

        .ch-tool.peligro:hover { color: rgb(248,113,113); }
        .ch-fly { position: fixed; z-index: 75; min-width: 230px; max-width: calc(100vw - 16px); overflow-y: auto; background: #0D1016; border: 1px solid var(--ch-line); border-radius: 12px; padding: 6px; box-shadow: 0 12px 40px rgba(0,0,0,.55); }
        .ch-fly[hidden] { display: none; }
        .ch-fly-fila { display: flex; align-items: center; } .ch-fly-fila .ch-fly-it { flex: 1; min-width: 0; }
        .ch-fly-it kbd { margin-left: auto; font: 10px/1 ui-monospace, monospace; color: #6B7280; border: 1px solid var(--ch-line); border-radius: 4px; padding: 2px 4px; }
        .ch-fly-fav { width: 34px; height: 34px; flex: none; border-radius: 8px; color: #4B5563; cursor: pointer; } .ch-fly-fav:hover { color: #FACC15; background: rgba(255,255,255,.06); } .ch-fly-fav.on { color: #FACC15; }
        .ch-tool:disabled { opacity: .3; cursor: default; } .ch-tool.fuerte { box-shadow: inset 0 -2px 0 rgb(var(--ch-accent)); }
        @media (pointer: coarse) { .ch-fly-it { padding: 12px 10px; } .ch-fly-fav { width: 44px; height: 44px; } .ch-tool { width: 44px; height: 44px; } }
        .ch-fly-it { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: #D1D5DB; font-size: 13px; text-align: left; cursor: pointer; }
        .ch-fly-it i { font-size: 18px; color: #9CA3AF; flex: none; }
        .ch-fly-it:hover { background: rgba(255,255,255,.06); color: #fff; }
        .ch-fly-it.on { color: rgb(var(--ch-accent)); background: rgba(var(--ch-accent),.12); }
        .al-pop { width: 330px; max-height: calc(100vh - 90px); overflow-y: auto; }
        .al-fila { display: flex; align-items: center; gap: 6px; padding: 8px 0; border-top: 1px solid var(--ch-line); font-size: 13px; color: #E5E7EB; }
        .al-fila.off { opacity: .6; } .al-txt { flex: 1; min-width: 0; } .al-txt small { color: #6B7280; font-size: 11px; }
        .al-fila button { width: 30px; height: 30px; border-radius: 8px; color: #9CA3AF; font-size: 16px; cursor: pointer; flex: none; } .al-fila button:hover { color: #fff; background: rgba(255,255,255,.07); }
        .al-form { display: flex; flex-direction: column; gap: 6px; } .al-fila2 { display: flex; gap: 6px; align-items: center; } .al-fila2 .mc-sel { flex: 1; height: 30px; min-width: 0; } .al-nota { height: 30px; }
        .al-push { display: flex; gap: 8px; align-items: center; font-size: 12px; color: #D1D5DB; background: rgba(34,211,238,.08); border: 1px solid rgba(34,211,238,.25); border-radius: 10px; padding: 8px; margin-bottom: 10px; }
        .al-msg { font-size: 12px; color: #FDE68A; margin: 0 0 8px; }
        .ch-plant { display: flex; gap: 6px; margin: 0 0 10px; }
        .ch-plant select { flex: 1; min-width: 0; background: #151A22; color: #E5E7EB; border: 1px solid var(--ch-line); border-radius: 8px; font-size: 12px; padding: 6px 8px; }
        .ch-plant button { background: #151A22; color: #D1D5DB; border: 1px solid var(--ch-line); border-radius: 8px; font-size: 12px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
        .ch-plant button:hover { color: #fff; border-color: #22D3EE; }
        .an-pop { width: 340px; max-height: calc(100vh - 90px); overflow-y: auto; }
        .an-med { text-align: center; padding: 6px 0 10px; } .an-med.grande { padding-bottom: 14px; }
        .an-med-t { font-size: 11px; color: #6B7280; text-transform: uppercase; letter-spacing: .06em; }
        .an-med-v { font-size: 16px; font-weight: 700; margin: 2px 0 8px; } .an-med.grande .an-med-v { font-size: 22px; }
        .an-barra { position: relative; height: 6px; border-radius: 3px; background: linear-gradient(90deg,#EF4444,#9CA3AF 50%,#22C55E); margin: 0 6px; }
        .an-barra i { position: absolute; top: -4px; width: 4px; height: 14px; margin-left: -2px; border-radius: 2px; background: #fff; box-shadow: 0 0 0 2px #0D1016; }
        .an-cuentas { display: flex; justify-content: space-between; font-size: 11px; color: #9CA3AF; margin-top: 8px; padding: 0 2px; }
        .an-dos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; border-top: 1px solid var(--ch-line); }
        .an-pop details { border-top: 1px solid var(--ch-line); padding: 6px 0; } .an-pop summary { cursor: pointer; font-size: 12px; font-weight: 600; color: #D1D5DB; }
        .an-tab { width: 100%; font-size: 12px; margin-top: 6px; border-collapse: collapse; } .an-tab td { padding: 3px 2px; color: #D1D5DB; } .an-tab td:nth-child(2) { color: #9CA3AF; text-align: right; } .an-tab td:last-child { text-align: right; font-weight: 600; }
        .sc { position: fixed; inset: 56px 12px 12px 12px; z-index: 78; background: #0D1016; border: 1px solid var(--ch-line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; box-shadow: 0 16px 60px rgba(0,0,0,.6); }
        .sc[hidden] { display: none; }
        .sc-cab { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; font-size: 12px; color: #9CA3AF; } .sc-cab > b { color: #fff; font-size: 14px; margin-right: 6px; }
        .sc-cab label { display: flex; gap: 6px; align-items: center; } .sc-cab .mc-sel { height: 28px; } .sc-cab .ch-tool { margin-left: auto; }
        .sc-tabla { flex: 1; min-height: 0; overflow: auto; }

        .sc td { padding: 9px 6px; border-bottom: 1px solid rgba(255,255,255,.04); color: #E5E7EB; white-space: nowrap; } .sc tbody tr { cursor: pointer; } .sc tbody tr:hover { background: rgba(255,255,255,.04); }
        .sc-sym small { display: block; color: #6B7280; font-size: 11px; } .sc-rat { text-align: center; font-weight: 600; } .sc-tend { color: #9CA3AF; font-size: 12px; } .sc-vacio { text-align: center; color: #6B7280; padding: 24px; }
        .pp-pop { width: 350px; max-height: calc(100vh - 90px); overflow-y: auto; }
        .pp-cuenta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; } .pp-cuenta div { background: #131722; border-radius: 10px; padding: 8px 10px; } .pp-cuenta small { display: block; font-size: 10px; color: #6B7280; text-transform: uppercase; letter-spacing: .05em; } .pp-cuenta b { font-size: 15px; }
        .pp-tabs { display: flex; gap: 4px; margin-bottom: 10px; } .pp-tabs button { flex: 1; font-size: 11px; padding: 6px 4px; border-radius: 8px; color: #9CA3AF; background: #151A22; cursor: pointer; } .pp-tabs button.on { color: #67E8F9; background: rgba(34,211,238,.14); }
        .pp-px { color: #E5E7EB; font-weight: 600; margin-left: auto; } .pp-buy, .pp-sell { flex: 1; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 13px; color: #fff; cursor: pointer; } .pp-buy { background: #16A34A; } .pp-sell { background: #DC2626; }
        .pp-capa { position: absolute; inset: 0; z-index: 7; pointer-events: none; overflow: hidden; }
        .pp-chip { position: absolute; right: 74px; top: 0; display: flex; align-items: center; gap: 6px; pointer-events: none; will-change: transform; }
        .pp-ficha { pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; background: rgba(13,16,22,.94); border: 1px solid var(--c); color: #F3F4F6; border-radius: 8px; padding: 3px 4px 3px 8px; font: 600 11px/1.2 Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums; box-shadow: 0 4px 14px rgba(0,0,0,.45); }
        .pp-t { white-space: nowrap; user-select: none; } .pp-sl .pp-t, .pp-tp .pp-t, .pp-orden .pp-t { cursor: ns-resize; touch-action: none; }

        .pp-x { min-width: 22px; height: 22px; padding: 0 5px; border-radius: 6px; color: #9CA3AF; font-size: 11px; font-weight: 700; cursor: pointer; background: rgba(255,255,255,.06); } .pp-x:hover { color: #fff; background: rgba(255,255,255,.14); } .pp-x.listo { color: #fff; background: #DC2626; }

        .pp-chip.fuera .pp-ficha { opacity: .85; border-style: dashed; } .pp-chip[data-fuera=arriba] .pp-t::before { content: '▲ '; } .pp-chip[data-fuera=abajo] .pp-t::before { content: '▼ '; }
        .pp-chip.arrastrando .pp-ficha { box-shadow: 0 0 0 2px var(--c), 0 6px 18px rgba(0,0,0,.6); }
        .pp-aviso { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: calc(100% - 24px); pointer-events: none; background: rgba(13,16,22,.96); border: 1px solid var(--ch-line); color: #F3F4F6; border-radius: 10px; padding: 8px 12px; font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }

        .cs-modal { position: fixed; z-index: 81; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100vw - 24px)); max-height: min(720px, calc(100vh - 32px)); display: flex; flex-direction: column; background: #131722; border: 1px solid #2A2E39; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); color: #D1D4DC; font-size: 13px; }
