<body class="h-screen flex items-center justify-center p-6">
    <div class="glass-card p-10 max-w-md w-full text-center">
        <div class="w-16 h-16 rounded-full bg-nlt-success/10 border border-nlt-success/20 flex items-center justify-center mx-auto mb-6">
            <i class="ph-fill ph-check-circle text-3xl text-nlt-success"></i>
        </div>
        <h1 class="text-xl font-bold mb-2">¡Pago confirmado!</h1>
        <p id="subtitulo" class="text-sm text-gray-400 mb-6">Tu plan está activo.</p>

        <div id="detalleBox" class="bg-black/20 border border-white/5 rounded-xl p-5 text-left mb-6">
            <p class="text-xs text-gray-500 animate-pulse">Cargando...</p>
        </div>

        <a id="btnDestino" href="dashboard.html" class="inline-block w-full py-3 rounded-xl bg-nlt-accent hover:bg-blue-500 font-semibold text-sm transition-all">Ir al Dashboard</a>
    </div>

    <script src="assets/vendor/supabase-2.117.3.js"></script>
    <script src="assets/js/nlt-shared.js?v=721ab12c"></script>
    <script src="assets/js/nlt-api-client.js?v=fda6c628"></script>
    <script>
        async function init() {
            const sesion = await NLT.requireSession();
            if (!sesion) return;

            const params = new URLSearchParams(window.location.search);
            const orderId = params.get('order');
            const box = document.getElementById('detalleBox');
            if (!orderId) {
                box.innerHTML = `<p class="text-xs text-nlt-danger">No se especificó ninguna orden.</p>`;
                return;
            }

            try {
                const orden = await NLT_API.obtenerOrden(orderId);
                if (orden.status !== 'paid') {
                    window.location.href = `pago-pendiente.html?order=${encodeURIComponent(orderId)}`;
                    return;
                }
                if (String(orden.plan || '').startsWith('NLT_BOT')) {
                    // NLT Bot Supreme: la licencia y el instalador viven en su propio panel (no en el de Copy System).
                    document.getElementById('subtitulo').textContent = 'Tu compra de NLT Bot Supreme está confirmada.';
                    box.innerHTML = `
                        <p class="text-sm text-gray-300 mb-3">Entra a tu panel del bot para ver tu licencia y descargar el instalador. Si la licencia aún no aparece, espera un minuto y recarga.</p>
                        <p class="text-sm text-gray-300 mb-3">Descarga también la <a href="assets/docs/NLT-Bot-Supreme-Guia.pdf" download="NLT-Bot-Supreme-Guia.pdf" class="text-nlt-accent font-semibold underline">guía de instalación y uso (PDF)</a>: te lleva paso a paso desde la instalación hasta tu primer día con el bot.</p>
                        <p class="text-[11px] text-gray-500 uppercase tracking-wider mb-1">Order ID</p>
                        <p class="text-sm font-mono text-white">${orden.order_id}</p>
                    `;
                    const destino = document.getElementById('btnDestino');
                    destino.href = 'nlt-bot-dashboard.html';
                    destino.textContent = 'Ir a mi licencia y descarga';
                    return;
                }
                const sub = await NLT_API.miSuscripcion();
                document.getElementById('subtitulo').textContent = `Tu plan ${orden.plan} está activo.`;
                box.innerHTML = `
                    <p class="text-[11px] text-gray-500 uppercase tracking-wider mb-1">Cuentas MT5 disponibles</p>
                    <p class="text-2xl font-bold text-white mb-4">${sub.max_accounts}</p>
                    <p class="text-[11px] text-gray-500 uppercase tracking-wider mb-1">Order ID</p>
                    <p class="text-sm font-mono text-white">${orden.order_id}</p>
                `;
            } catch (err) {
                box.innerHTML = `<p class="text-xs text-nlt-danger">Error: ${err.message}</p>`;
            }
        }
        init();
    </script>
</body>
</html>
