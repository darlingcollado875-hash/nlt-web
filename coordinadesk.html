                    <p class="cd-sub" style="margin-top:12px">La importación <b>combina</b> por id: añade y actualiza registros, nunca borra los existentes. Acepta el respaldo de este espacio y el formato del Coordina Desk original (se ignoran los archivos adjuntos incrustados; usa enlaces de Drive).</p></div>
                <div class="glass-card" style="padding:22px;margin-bottom:16px"><h3 style="font-weight:800;font-size:16px;margin-bottom:4px">Recordatorios de la agenda</h3>
                    <p class="cd-sub" style="margin-bottom:14px">Cada publicación, reunión y lanzamiento nuevo crea solo su recordatorio en la agenda. Si ya tenías entradas de antes, este botón crea los recordatorios que falten (solo de fechas de hoy en adelante) y actualiza los existentes. Si una entrada no tiene hora, el recordatorio sale a las 09:00.</p>
                    <button class="cd-btn" data-act="sync-agenda"><i class="ph ph-arrows-clockwise"></i> Crear recordatorios que falten</button></div>
                <div class="glass-card" style="padding:22px;margin-bottom:16px"><h3 style="font-weight:800;font-size:16px;margin-bottom:4px">Recordatorios con la página cerrada</h3>
                    <p class="cd-sub" style="margin-bottom:14px">Activa las notificaciones en este dispositivo y recibirás los recordatorios de la Agenda <b>aunque Workspace NLT esté cerrado</b> (celular o computador). El aviso le llega al <b>responsable</b> de la actividad (su correo en «Mi Equipo» debe ser el de su cuenta NLT); si no hay responsable, a quien la creó. Solo lo reciben personas con acceso al Workspace.</p>
                    <div class="cd-bar" style="margin-bottom:0"><button class="cd-btn primary" id="cdPushBtn" disabled>Comprobando…</button><button class="cd-btn" data-act="push-test" id="cdPushTest" disabled><i class="ph ph-bell-ringing"></i> Enviarme una prueba</button></div>
                    <p class="cd-sub" id="cdPushMsg" style="margin-top:12px">En iPhone/iPad hay que instalar NLT en la pantalla de inicio (Compartir → Añadir a pantalla de inicio) para recibir avisos.</p></div>
                <div class="glass-card" style="padding:22px"><h3 style="font-weight:800;font-size:16px;margin-bottom:10px">Departamentos</h3>
                    <div style="display:flex;flex-wrap:wrap;gap:8px">${DEPTS.map((d) => `<span class="cd-badge"><span class="cd-dot" style="background:${d.color}"></span>${esc(d.name)}</span>`).join('')}</div>
                    <p class="cd-sub" style="margin-top:12px">Acceso: solo el Global Admin y las personas a las que él da acceso${IS_GLOBAL ? ' (arriba, en “Acceso del equipo”)' : ''}.</p></div>`;
        }

        // --- Acceso del equipo (solo Global Admin). Usa los endpoints existentes de
        //     Administración Global; PUT /permissions REEMPLAZA el set completo, así que
        //     siempre se parte de los permisos actuales para no pisar los de otro módulo. ---
        let ACCESS = { admins: [] };
        const conAcceso = (a) => a.activo && a.permissions && a.permissions.coordina;

        async function cargarAcceso() {
            const box = document.getElementById('cdAccessList');
            if (!box) return;
            try {
                ACCESS.admins = await NLT_API.adminGlobalAdmins();
                const lista = ACCESS.admins.filter(conAcceso);
                box.innerHTML = lista.length ? lista.map((a) => {
                    const otros = Object.entries(a.permissions).filter(([k, v]) => v && k !== 'coordina').length;
                    return `<div class="glass-item" style="padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div style="flex:1;min-width:180px"><b style="font-size:13px">${esc(a.email || a.user_id)}</b><div class="cd-sub">${otros ? `También es admin de ${otros} módulo(s) más` : 'Solo Workspace NLT'}</div></div><button class="cd-btn sm danger" data-act="acc-revoke" data-id="${esc(a.user_id)}" data-email="${esc(a.email || '')}">Quitar acceso</button></div>`;
                }).join('') : '<p class="cd-sub">Nadie más tiene acceso todavía.</p>';
            } catch (e) { box.innerHTML = `<p class="cd-sub cd-tone-bad">No se pudo cargar: ${esc(e.message)}</p>`; }
        }

        async function buscarAcceso() {
            const q = document.getElementById('cdAccessQ').value.trim();
            const box = document.getElementById('cdAccessResults');
            if (!q) { box.innerHTML = '<p class="cd-sub">Escribe un correo o parte de él.</p>'; return; }
            box.innerHTML = '<p class="cd-sub">Buscando…</p>';
            try {
                const us = await NLT_API.adminGlobalUsuarios(q);
                const mios = new Set(ACCESS.admins.filter(conAcceso).map((a) => a.user_id));
                box.innerHTML = us.length ? us.slice(0, 15).map((u) => `<div class="glass-item" style="padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span style="flex:1;min-width:180px;font-size:13px">${esc(u.email)}</span>${u.email === SESSION.user.email ? '<span class="cd-badge cd-tone-warn">Global Admin (tú)</span>' : mios.has(u.user_id) ? '<span class="cd-badge cd-tone-ok">Ya tiene acceso</span>' : `<button class="cd-btn sm primary" data-act="acc-grant" data-id="${esc(u.user_id)}" data-email="${esc(u.email)}">Dar acceso completo</button>`}</div>`).join('') : '<p class="cd-sub">Sin resultados. La persona debe haber iniciado sesión en NLT al menos una vez.</p>';
            } catch (e) { box.innerHTML = `<p class="cd-sub cd-tone-bad">Error: ${esc(e.message)}</p>`; }
        }

        async function darAcceso(userId, email) {
            if (!confirm(`¿Dar acceso completo al Workspace NLT a ${email}?`)) return;
            try {
                const lista = await NLT_API.adminGlobalAdmins();
                const ex = lista.find((a) => a.user_id === userId);
                // Si estaba revocado, no reactivamos permisos viejos de otros módulos.
                const base = ex && ex.activo ? ex.permissions : {};
                await NLT_API.adminGlobalGuardarPermisos(userId, { ...base, coordina: true });
                toast('Acceso concedido a ' + email, 'ok');
                await cargarAcceso(); await buscarAcceso();
            } catch (e) { toast('No se pudo dar acceso: ' + e.message, 'err'); }
        }

        async function quitarAcceso(userId, email) {
            if (!confirm(`¿Quitar el acceso al Workspace NLT a ${email || 'esta persona'}?`)) return;
            try {
                const lista = await NLT_API.adminGlobalAdmins();
                const ex = lista.find((a) => a.user_id === userId);
                if (!ex) return;
                const resto = { ...ex.permissions, coordina: false };
                if (Object.values(resto).some(Boolean)) await NLT_API.adminGlobalGuardarPermisos(userId, resto);
                else await NLT_API.adminGlobalRevocar(userId, true);   // no le queda ningún permiso: se borra la fila
                toast('Acceso retirado', 'ok');
                await cargarAcceso();
            } catch (e) { toast('No se pudo quitar el acceso: ' + e.message, 'err'); }
        }

        // --- Actividad: quién hizo qué (solo Global Admin; el servidor también lo exige) ---
        const ACT = { rows: [], who: 'all', loaded: false, error: '' };
        const COL_LABEL = { team: 'Mi Equipo', items: 'Agenda', affiliates: 'Afiliados', payments: 'Finanzas', contracts: 'Contratos', meetings: 'Reuniones', publications: 'Marketing', academyClasses: 'Academia', devChanges: 'Programación', launches: 'Lanzamientos', reports: 'Informes' };
        const ACT_LABEL = { 'coordina.crear': ['Creó', 'ok'], 'coordina.editar': ['Editó', 'info'], 'coordina.borrar': ['Eliminó', 'bad'], 'coordina.importar': ['Importó datos', 'vio'] };

        // Valor "antes/después" legible: personas, estados y departamentos por su nombre (no por id).
        function campoDef(col, k) {
            const m = Object.values(MODS).find((x) => x.col === col);
            return m && m.fields ? m.fields.find((f) => f.k === k) : null;
        }
        function fmtValor(f, v) {
            if (v === '' || v == null) return '—';
            if (typeof v === 'boolean') return v ? 'Sí' : 'No';
            const t = f && f.t;
            if (t === 'check') return v ? 'Sí' : 'No';
            if (t === 'member') return mname(v);
            if (t === 'members') return (Array.isArray(v) ? v : []).map(mname).join(', ') || '—';
            if (t === 'dept') return (dept(v) || { name: v }).name;
            if (t === 'affiliate') { const a = S.affiliates.find((x) => x.id === v); return a ? `${a.affiliateCode || ''} ${a.fullName}`.trim() : String(v); }
            if (t === 'select') { const o = optOf(f.opts, v); return o ? o.l : String(v); }
            if (t === 'date') return fmtDate(v).replace(/&[a-z#0-9]+;/g, '');
            if (t === 'money') return money(v);
            if (Array.isArray(v)) {
                if (!v.length) return '—';
                return v.map((o) => (o && typeof o === 'object' ? (o.title || o.name || o.task || o.changedFields || Object.values(o).find((x) => typeof x === 'string' && x) || '·') : String(o))).join(' · ');
            }
            if (typeof v === 'object') return JSON.stringify(v);
            return String(v);
        }
        function cambiosHTML(d) {
            const lista = (d.cambios || []);
            if (!lista.length) return '';
            const filas = lista.slice(0, 12).map((c) => {
                const f = campoDef(d.coleccion, c.campo);
                return `<div class="cd-sub" style="margin-top:4px"><b style="color:#D1D5DB">${esc(f ? f.l : c.campo)}:</b> <span style="text-decoration:line-through;opacity:.7">${esc(fmtValor(f, c.antes))}</span> → <span class="cd-tone-ok">${esc(fmtValor(f, c.despues))}</span></div>`;
            }).join('');
            return filas + (lista.length > 12 ? `<div class="cd-sub">+${lista.length - 12} cambios más</div>` : '');
        }

        function actividadListHTML() {
            if (ACT.error) return `<div class="glass-card cd-empty"><i class="ph ph-warning"></i>${esc(ACT.error)}</div>`;
            if (!ACT.loaded) return '<div class="glass-card cd-empty"><i class="ph ph-circle-notch"></i>Cargando…</div>';
            const rows = ACT.rows.filter((r) => ACT.who === 'all' || r.actor === ACT.who);
            if (!rows.length) return '<div class="glass-card cd-empty"><i class="ph ph-clock-counter-clockwise"></i>Todavía no hay actividad registrada.</div>';
            return `<div class="glass-card cd-scroll"><table class="cd-table"><thead><tr><th>Cuándo</th><th>Quién</th><th>Qué hizo</th><th>Dónde</th></tr></thead><tbody>${rows.map((r) => {
                const [l, tone] = ACT_LABEL[r.accion] || [r.accion, 'mute'];
                const d = r.detalle || {};
                return `<tr><td style="white-space:nowrap">${new Date(r.fecha).toLocaleString('es', { dateStyle: 'short', timeStyle: 'short' })}</td><td>${esc(r.actor)}</td><td><span class="cd-badge cd-tone-${tone}">${esc(l)}</span></td><td>${d.coleccion ? `<b>${esc(COL_LABEL[d.coleccion] || d.coleccion)}</b>` : ''}${d.titulo ? `<div class="cd-sub">${esc(d.titulo)}</div>` : ''}${cambiosHTML(d)}${d.registros ? `<div class="cd-sub">${esc(d.registros)} registros</div>` : ''}</td></tr>`;
            }).join('')}</tbody></table></div>`;
        }

        function viewActivity() {
            const quienes = Array.from(new Set(ACT.rows.map((r) => r.actor))).sort();
            return `<div class="cd-bar"><select class="cd-select" id="cdActWho"><option value="all">Todas las personas</option>${quienes.map((q) => `<option value="${esc(q)}" ${ACT.who === q ? 'selected' : ''}>${esc(q)}</option>`).join('')}</select><span class="cd-sub cd-grow">Últimos movimientos del Workspace: quién creó, editó o eliminó cada registro.</span><button class="cd-btn" data-act="act-reload"><i class="ph ph-arrows-clockwise"></i> Actualizar</button></div><div id="cdActList">${actividadListHTML()}</div>`;
        }

        async function cargarActividad() {
            try { ACT.rows = await NLT_API.coordinaActividad(); ACT.error = ''; }
            catch (e) { ACT.error = 'No se pudo cargar la actividad: ' + e.message; }
            ACT.loaded = true;
            if (UI.tab === 'activity') { const el = document.getElementById('cdContent'); if (el && !modalOpen) el.innerHTML = viewActivity(); }
        }

        // --- Recordatorios con la página cerrada (Web Push; reutiliza el push del ecosistema) ---
        async function montarPush() {
            const btn = document.getElementById('cdPushBtn'), test = document.getElementById('cdPushTest');
            if (!btn || !window.NLT || !NLT.pushEstado) return;
            const pintar = async () => {
                const e = await NLT.pushEstado();
                PUSH_ON = e === 'suscrito';
                btn.dataset.estado = e;
                btn.disabled = e === 'sin-soporte' || e === 'denegado';
                btn.textContent = { suscrito: 'Desactivar en este dispositivo', 'no-suscrito': 'Activar en este dispositivo', denegado: 'Bloqueadas en el navegador', 'sin-soporte': 'Este navegador no soporta notificaciones' }[e] || 'Activar en este dispositivo';
                btn.classList.toggle('primary', e !== 'suscrito');
                test.disabled = e !== 'suscrito';
                const msg = document.getElementById('cdPushMsg');
                if (msg && e === 'denegado') msg.innerHTML = 'Bloqueaste las notificaciones de este sitio: actívalas desde el candado de la barra de direcciones y vuelve a intentarlo.';
            };
            await pintar();
            btn.addEventListener('click', async () => {
                btn.disabled = true;
                const ya = btn.dataset.estado === 'suscrito';
                const ok = ya ? await NLT.pushDesactivar() : await NLT.pushActivar();
                if (!ya && !ok) toast('No se pudieron activar las notificaciones (permiso denegado o avisos aún no configurados en el servidor).', 'err');
                await pintar();
            });
        }

        // Normaliza el formato del Coordina Desk original (React) al de este espacio.
        function normalizarImport(obj) {
            const src = obj.collections || obj;
            const alias = { teamMembers: 'team' };
            const out = {};
            for (const [kRaw, v] of Object.entries(src)) {
                const k = alias[kRaw] || kRaw;
                if (!Array.isArray(v) || !(k in S)) continue;
                out[k] = v.map((r) => {
                    const o = { ...r };
                    if (!o.id) o.id = uid(k.slice(0, 3));
                    delete o._updated_at;
                    if (k === 'meetings' && o.nextMeeting) { o.nextScheduled = !!o.nextMeeting.scheduled; o.nextDate = o.nextMeeting.date; o.nextTime = o.nextMeeting.time; o.nextObjective = o.nextMeeting.objective; delete o.nextMeeting; }
                    if (k === 'contracts' && o.pdfFile) { delete o.pdfFile; }
                    if (k === 'affiliates' && o.contractFile) { delete o.contractFile; }
                    return o;
                });
            }
            return out;
        }

        // ------------------------------------------------------------------
        // Render + eventos
        // ------------------------------------------------------------------
        function renderTabs() {
            document.getElementById('cdTabs').innerHTML = ORDER.filter((id) => id !== 'activity' || IS_GLOBAL).map((id) => `<button class="tab-admin ${UI.tab === id ? 'activo' : ''}" data-act="tab" data-tab="${id}"><i class="ph-fill ${MODS[id].icon} mr-1.5"></i>${esc(MODS[id].label)}</button>`).join('');
        }

        function render() {
            renderTabs();
            const root = document.getElementById('cdContent');
            root.innerHTML = UI.tab === 'daily' ? viewDaily() : UI.tab === 'reports' ? viewReports() : UI.tab === 'settings' ? viewSettings() : UI.tab === 'activity' ? viewActivity() : viewModule(UI.tab);
            const f = document.getElementById('cdImportFile');
            if (f) f.addEventListener('change', onImportFile);
            if (UI.tab === 'activity' && IS_GLOBAL && !renderActividadCargando) { renderActividadCargando = true; cargarActividad().finally(() => { renderActividadCargando = false; }); }
            if (UI.tab === 'settings') montarPush();
            if (UI.tab === 'settings' && IS_GLOBAL) { cargarAcceso(); const q = document.getElementById('cdAccessQ'); if (q) q.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') buscarAcceso(); }); }
        }

        function refreshList() {
            const el = document.getElementById('cdList');
            if (!el) return;
            el.innerHTML = UI.tab === 'daily' ? agendaBody() : listHTML(UI.tab);
        }

        function openDetail(modId, r) {
            const m = MODS[modId];
            const filas = m.detail(r).filter(([, v]) => v != null && String(v).trim() !== '' && v !== '—');
            openModal(`<h2>${esc(r.title || r.fullName || r.topic || 'Detalle')}</h2><div class="cd-form" style="margin-bottom:8px">${filas.map(([l, v]) => `<div class="cd-field ${String(v).length > 60 || String(v).includes('\n') ? 'full' : ''}"><label>${esc(l)}</label><div class="cd-detail">${esc(v)}</div></div>`).join('')}</div>
                <div class="cd-foot"><button class="cd-btn" data-act="close">Cerrar</button><button class="cd-btn primary" data-act="edit" data-mod="${modId}" data-id="${esc(r.id)}"><i class="ph ph-pencil-simple"></i> Editar</button></div>`);
        }

        async function onImportFile(e) {
            const file = e.target.files[0];
            e.target.value = '';
            if (!file) return;
            try {
                const obj = JSON.parse(await file.text());
                const cols = normalizarImport(obj);
                const total = Object.values(cols).reduce((s, a) => s + a.length, 0);
                if (!total) { toast('El archivo no contiene registros reconocibles.', 'err'); return; }
                if (!confirm(`Importar ${total} registros (se combinan por id con los existentes)?`)) return;
                const r = await NLT_API.coordinaImportar(cols);
                await cargar(true);
                toast(`Importados ${r.importados} registros`, 'ok');
                render();
            } catch (err) { toast('Importación fallida: ' + err.message, 'err'); }
        }

        document.addEventListener('click', async (e) => {
            const t = e.target.closest('[data-act]');
            if (!t) return;
            const act = t.dataset.act;
            if (act === 'overlay') { if (e.target === t) closeModal(); return; }
            if (act === 'close') return pedirCerrar();
            if (act === 'tab') { UI.tab = t.dataset.tab; UI.q = ''; UI.status = 'all'; UI.limit = PAGE; return render(); }
            if (act === 'more') { UI.limit += PAGE; return refreshList(); }
            if (act === 'retry') { location.reload(); return; }
            if (act === 'new') return openForm(t.dataset.mod, null, t.dataset.dept ? { departmentId: t.dataset.dept } : null);
            if (act === 'ver-agenda-dept') {
                const sig = S.items.filter((i) => i.departmentId === t.dataset.dept && i.status !== 'completed').sort((a, b) => String(a.date).localeCompare(String(b.date)))[0];
                UI.tab = 'daily'; UI.dept = t.dataset.dept; UI.q = ''; UI.status = 'all'; UI.type = 'all'; UI.agendaView = 'week'; UI.limit = PAGE; if (sig) UI.date = sig.date;
                return render();
            }
            if (act === 'sync-agenda') { t.disabled = true; const n = await sincronizarTodo(); t.disabled = false; toast(n ? `Se crearon ${n} recordatorio(s) en la agenda` : 'La agenda ya tiene todos los recordatorios', 'ok'); return render(); }
            const modId = t.dataset.mod;
            if (act === 'edit') { closeModal(); const rec = S[MODS[modId].col].find((x) => x.id === t.dataset.id); return rec && openForm(modId, rec); }
            if (act === 'view') { const rec = S[MODS[modId].col].find((x) => x.id === t.dataset.id); return rec && openDetail(modId, rec); }
            if (act === 'del') {
                let aviso = '¿Eliminar este registro? Esta acción no se puede deshacer.';
                if (MODS[modId].col === 'team') {
                    const n = referenciasDe(t.dataset.id);
                    if (n.total) aviso = `Esta persona tiene ${n.total} elemento(s) asignado(s) (${n.detalle}).\nSi la eliminas quedarán sin responsable.\n\n¿Eliminar de todos modos?`;
                }
                const colDel = MODS[modId].col;
                const previo = S[colDel].find((x) => x.id === t.dataset.id);
                if (AUTO[colDel] && itemDeOrigen(colDel, t.dataset.id)) aviso += '\n\nTambién se eliminará su recordatorio de la agenda.';
                if (colDel === 'items' && previo && previo.autoSource) aviso = `Este recordatorio se creó automáticamente desde una ${(AUTO[previo.autoSource.col] || {}).etiqueta || 'entrada'}.\nSi lo eliminas, esa entrada dejará de crear recordatorio en la agenda.\n\n¿Eliminar?`;
                if (!confirm(aviso)) return;
                if (await borrar(colDel, t.dataset.id)) {
                    if (AUTO[colDel]) await quitarRecordatoriosDe(colDel, t.dataset.id);
                    if (colDel === 'items' && previo && previo.autoSource) {   // la persona lo borró a propósito: no se vuelve a crear
                        const origen = (S[previo.autoSource.col] || []).find((x) => x.id === previo.autoSource.id);
                        if (origen && origen.recordatorioAgenda !== false) await guardar(previo.autoSource.col, { ...origen, recordatorioAgenda: false });
                    }
                    toast('Eliminado', 'ok'); render();
                }
                return;
            }
            if (act === 'toggle') {
                const i = S.items.find((x) => x.id === t.dataset.id); if (!i) return;
                const nuevo = { ...i, status: i.status === 'completed' ? 'pending' : 'completed' };
                if (nuevo.status === 'completed') nuevo.completedAt = new Date().toISOString(); else delete nuevo.completedAt;
                if (await guardar('items', nuevo)) render();
                return;
            }
            if (act === 'date-prev') { UI.limit = PAGE; UI.date = addDays(UI.date, UI.agendaView === 'week' ? -7 : -1); return render(); }
            if (act === 'date-next') { UI.limit = PAGE; UI.date = addDays(UI.date, UI.agendaView === 'week' ? 7 : 1); return render(); }
            if (act === 'date-today') { UI.limit = PAGE; UI.date = hoy(); return render(); }
            if (act === 'date-set') { UI.limit = PAGE; UI.date = t.dataset.d; UI.agendaView = 'day'; return render(); }
            if (act === 'aview') { UI.agendaView = t.dataset.v; return render(); }
            if (act === 'row-add') {
                const m = MODS[UI.tab]; const f = m.fields.find((x) => x.k === t.dataset.k);
                const box = document.querySelector(`[data-rows="${t.dataset.k}"]`);
                box.insertAdjacentHTML('beforeend', rowHTML(f, {})); return;
            }
            if (act === 'row-del') { t.closest('.cd-subrow').remove(); return; }
            if (act === 'rep-gen') {
                const modSel = document.getElementById('repMod').value, period = document.getElementById('repPeriod').value;
                const rep = modSel === '__global' ? informeGlobal(period) : generarInforme(modSel, period);
                if (await guardar('reports', rep)) { descargar(rep.fileName, rep.content, 'text/csv;charset=utf-8'); toast('Informe generado', 'ok'); render(); }
                return;
            }
            if (act === 'rep-dl') { const r = S.reports.find((x) => x.id === t.dataset.id); if (r) descargar(r.fileName, r.content, 'text/csv;charset=utf-8'); return; }
            if (act === 'rep-del') { if (confirm('¿Eliminar este informe?') && await borrar('reports', t.dataset.id)) render(); return; }
            if (act === 'export') { descargar(`workspace-nlt-respaldo-${hoy()}.json`, JSON.stringify({ version: '1.0.0', exportedAt: new Date().toISOString(), source: 'Workspace NLT', collections: S }, null, 2), 'application/json'); return; }
            if (act === 'import-pick') { document.getElementById('cdImportFile').click(); return; }
            if (act === 'act-reload') { ACT.loaded = false; render(); return; }
            if (act === 'push-test') {
                t.disabled = true;
                try {
                    const r = await NLT_API.coordinaPushTest();
                    toast(!r.configurado ? 'Los avisos push aún no están configurados en el servidor.' : r.enviados ? 'Prueba enviada: debería llegarte en unos segundos.' : 'No hay dispositivos suscritos para tu cuenta.', r.enviados ? 'ok' : 'err');
                } catch (e) { toast('No se pudo enviar la prueba: ' + e.message, 'err'); }
                t.disabled = false; return;
            }
            if (act === 'acc-search') return buscarAcceso();
            if (act === 'acc-grant') return darAcceso(t.dataset.id, t.dataset.email);
            if (act === 'acc-revoke') return quitarAcceso(t.dataset.id, t.dataset.email);
        });

        let searchTimer = 0;
        let HOY_ACTUAL = hoy();
        function revisarCambioDeDia() {
            const h = hoy();
            if (h === HOY_ACTUAL) return;
            if (UI.date === HOY_ACTUAL) UI.date = h;   // si estaba mirando "hoy", pasa al nuevo día
            HOY_ACTUAL = h;
            if (!modalOpen) render();
        }
        setInterval(revisarCambioDeDia, 60000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) revisarCambioDeDia(); });
        document.addEventListener('input', (e) => {
            if (e.target.id === 'cdSearch') {
                clearTimeout(searchTimer);
                const v = e.target.value;
                searchTimer = setTimeout(() => { UI.q = v; UI.limit = PAGE; refreshList(); }, 150);   // sin esto, cada tecla repintaba toda la lista
            }
        });
        document.addEventListener('change', (e) => {
            const id = e.target.id;
            if (id === 'cdStatus') { UI.status = e.target.value; UI.limit = PAGE; refreshList(); }
            else if (id === 'cdDept') { UI.dept = e.target.value; UI.limit = PAGE; refreshList(); }
            else if (id === 'cdType') { UI.type = e.target.value; UI.limit = PAGE; refreshList(); }
            else if (id === 'cdActWho') { ACT.who = e.target.value; document.getElementById('cdActList').innerHTML = actividadListHTML(); }
        });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalOpen) pedirCerrar(); });

        // ------------------------------------------------------------------
        // Recordatorios de la agenda (mientras la página está abierta)
        // ------------------------------------------------------------------
        function avisados() { try { return JSON.parse(localStorage.getItem('cd_avisados') || '[]'); } catch (_) { return []; } }
        function revisarRecordatorios() {
            const ya = avisados();
            const ahora = new Date();
            let cambio = false;
            for (const i of S.items) {
                if (!i.automaticReminder || i.status === 'completed' || !i.time || !i.date || !(i.reminderLeadTime in LEAD_MIN)) continue;
                const [h, mi] = i.time.split(':').map(Number);
                const inicio = parseYmd(i.date); inicio.setHours(h, mi, 0, 0);
                const aviso = new Date(inicio.getTime() - LEAD_MIN[i.reminderLeadTime] * 60000);
                const clave = i.id + '|' + i.date + '|' + i.time + '|' + i.reminderLeadTime;
                if (ahora >= aviso && ahora <= new Date(inicio.getTime() + 15 * 60000) && !ya.includes(clave)) {
                    ya.push(clave); cambio = true;
                    toast(`🔔 ${i.title} · ${i.time}`, 'ok');
                    if (!PUSH_ON && 'Notification' in window && Notification.permission === 'granted') { try { new Notification('Workspace NLT', { body: `${i.title} · ${i.time}` }); } catch (_) {} }
                }
            }
            if (cambio) { try { localStorage.setItem('cd_avisados', JSON.stringify(ya.slice(-300))); } catch (_) {} }
        }

        // ------------------------------------------------------------------
        // Init: sesión + permiso "coordina" (la protección real está en cada endpoint)
        // ------------------------------------------------------------------
        async function init() {
            const session = await NLT.requireSession();
            if (!session) return;
            SESSION = session;
            IS_GLOBAL = NLT.isGlobalAdmin(session);
            if (NLT.pushEstado) NLT.pushEstado().then((e) => { PUSH_ON = e === 'suscrito'; }).catch(() => {});
            if (!NLT.isGlobalAdmin(session)) {
                let ok = false;
                try { const mp = await NLT_API.adminMisPermisos(); ok = !!(mp.permissions && mp.permissions.coordina); } catch (_) { ok = false; }
                if (!ok) { window.location.href = 'dashboard.html'; return; }
            }
            await NLT.mountSidebar(session, { activo: 'admin', seccion: 'cfd', planLabel: 'Admin' });
            const hash = (location.hash || '').replace('#', '');
            if (MODS[hash]) UI.tab = hash;
            render();
            document.getElementById('cdContent').innerHTML = '<div class="cd-empty"><i class="ph ph-circle-notch"></i>Cargando…</div>';
            const ok = await cargar();
            if (!ok) {
                const sinPermiso = /permiso|403|401/i.test(LOAD_ERR);
                document.getElementById('cdContent').innerHTML = `<div class="glass-card cd-empty"><i class="ph ph-warning"></i><b style="color:#fff">${sinPermiso ? 'No tienes permiso para este espacio' : 'No se pudieron cargar los datos'}</b><div class="cd-sub" style="margin:8px 0 16px">${esc(LOAD_ERR)}</div><button class="cd-btn primary" data-act="retry">Reintentar</button></div>`;
                return;
            }
            render();
            revisarRecordatorios();
            NLT.pollWhileVisible(async () => {
                if (modalOpen || pendingSaves > 0) return;
                if (await cargar(true)) {
                    revisarRecordatorios();
                    // Solo se repinta si llegaron datos distintos y la persona no está escribiendo.
                    if (DATA_CHANGED && (!document.activeElement || !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))) render();
                }
            }, 60000);
            document.getElementById('cdRefresh').addEventListener('click', async () => { if (await cargar()) { if (DATA_CHANGED) render(); toast('Actualizado', 'ok'); } });
        }
        init();
    })();
    </script>
</body>
</html>
