    <style>
        /* Mismo chrome que admin.html (fondo, glass-card, sidebar mobile). El
           tailwind.css del sitio está compilado y no incluye clases nuevas, así
           que todo lo propio de esta página va en clases cd-* (aquí abajo). */
        html { overflow-x: hidden; }
        @media (max-width: 767px) {
            #sidebar { position: fixed; top: 0; bottom: 0; left: 0; z-index: 50; transform: translateX(-100%); transition: transform 300ms; }
            #sidebar.sidebar-open { transform: translateX(0); }
        }
        @media (prefers-reduced-motion: reduce) { #sidebar { transition: none; } }
        body { background-color: #080A0F; background-image: radial-gradient(650px circle at 0% 0%, rgba(67,120,255,0.09), transparent 60%), radial-gradient(550px circle at 100% 100%, rgba(34,197,94,0.05), transparent 60%); background-attachment: fixed; color: #FFFFFF; -webkit-font-smoothing: antialiased; }
        .glass-card { background: linear-gradient(180deg, rgba(17, 21, 28, 0.7) 0%, rgba(13, 16, 22, 0.9) 100%); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 24px; }
        .glass-item { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.03); border-radius: 16px; }
        ::-webkit-scrollbar { width: 0px; height: 0px; background: transparent; }
        .tab-admin { padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; color: #9CA3AF; white-space: nowrap; transition: all .2s; cursor: pointer; }
        .tab-admin:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .tab-admin.activo { color: #4378FF; background: rgba(67,120,255,0.1); }

        /* --- Coordina Desk --- */
        .cd-wrap { max-width: 1280px; margin: 0 auto; }
        .cd-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 18px; }
        .cd-grow { flex: 1 1 auto; }
        .cd-input, .cd-select, .cd-textarea { background: #11151C; border: 1px solid rgba(255,255,255,0.08); color: #fff; border-radius: 12px; padding: 10px 12px; font-size: 13px; width: 100%; outline: none; transition: border-color .15s; font-family: inherit; }
        .cd-input:focus, .cd-select:focus, .cd-textarea:focus { border-color: #4378FF; }
        .cd-select option { background: #11151C; color: #fff; }
        .cd-textarea { min-height: 84px; resize: vertical; }
        .cd-bar .cd-input, .cd-bar .cd-select { width: auto; min-width: 150px; }
        .cd-btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.05); color: #fff; transition: all .15s; white-space: nowrap; }
        .cd-btn:hover { background: rgba(255,255,255,0.1); }
        .cd-btn.primary { background: #4378FF; border-color: #4378FF; }
        .cd-btn.primary:hover { background: #5a89ff; }
        .cd-btn.danger { color: #f87171; }
        .cd-btn.sm { padding: 6px 10px; font-size: 12px; border-radius: 9px; }
        .cd-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
        .cd-kpi { padding: 16px 18px; }
        .cd-kpi b { display: block; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin-top: 4px; font-family: Geist, Inter, sans-serif; }
        .cd-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #6B7280; }
        .cd-tone-ok { color: #22C55E; } .cd-tone-warn { color: #F59E0B; } .cd-tone-bad { color: #f87171; } .cd-tone-info { color: #4378FF; } .cd-tone-vio { color: #a78bfa; } .cd-tone-mute { color: #9CA3AF; }
        .cd-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; background: rgba(255,255,255,0.06); white-space: nowrap; }
        .cd-badge.cd-tone-ok { background: rgba(34,197,94,.12); } .cd-badge.cd-tone-warn { background: rgba(245,158,11,.12); } .cd-badge.cd-tone-bad { background: rgba(248,113,113,.12); } .cd-badge.cd-tone-info { background: rgba(67,120,255,.14); } .cd-badge.cd-tone-vio { background: rgba(167,139,250,.14); }
        .cd-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .cd-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .cd-table th { text-align: left; padding: 12px 16px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #6B7280; border-bottom: 1px solid rgba(255,255,255,0.06); white-space: nowrap; }
        .cd-table td { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle; overflow-wrap: anywhere; min-width: 90px; }
        .cd-table tr:last-child td { border-bottom: none; }
        .cd-table tbody tr:hover { background: rgba(255,255,255,0.025); }
        .cd-scroll { overflow-x: auto; }
        .cd-sub { color: #6B7280; font-size: 12px; margin-top: 2px; }
        .cd-empty { padding: 56px 20px; text-align: center; color: #6B7280; font-size: 13px; }
        .cd-empty i { display: block; font-size: 34px; margin-bottom: 10px; color: #374151; }
        .cd-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
        .cd-card { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
        .cd-card h3 { font-size: 15px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
        .cd-card { min-width: 0; }
        .cd-card p, .cd-sub { overflow-wrap: anywhere; }
        .cd-card p { font-size: 12.5px; color: #9CA3AF; line-height: 1.5; }
        .cd-row-actions { display: flex; gap: 6px; justify-content: flex-end; }
        .cd-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0; }
        .cd-board { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; align-items: start; }
        .cd-col { padding: 14px; min-height: 160px; }
        .cd-col h4 { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; margin-bottom: 12px; }
        .cd-col { min-width: 0; }
        .cd-col .glass-item { padding: 12px; margin-bottom: 10px; cursor: pointer; min-width: 0; overflow-wrap: anywhere; }
        .cd-col .cd-title { line-height: 1.35; }
        .cd-col .glass-item:hover { border-color: rgba(67,120,255,.4); }
        .cd-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 18px; }
        .cd-day { padding: 10px 6px; text-align: center; border-radius: 14px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.02); transition: all .15s; }
        .cd-day:hover { background: rgba(255,255,255,0.06); }
        .cd-day.sel { background: rgba(67,120,255,.14); border-color: #4378FF; }
        .cd-day.hoy b { color: #4378FF; }
        .cd-day small { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #6B7280; font-weight: 700; }
        .cd-day b { display: block; font-size: 18px; margin: 2px 0; font-family: Geist, Inter, sans-serif; }
        .cd-day i { font-style: normal; font-size: 10px; color: #9CA3AF; }
        .cd-item { display: flex; gap: 12px; padding: 14px 16px; align-items: flex-start; }
        .cd-item + .cd-item { margin-top: 8px; }
        .cd-time.wide { width: 70px; }
        .cd-time { width: 54px; flex-shrink: 0; font-size: 12px; font-weight: 700; color: #9CA3AF; padding-top: 2px; font-variant-numeric: tabular-nums; }
        .cd-check { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.25); background: transparent; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 1px; color: transparent; }
        .cd-check.on { background: #22C55E; border-color: #22C55E; color: #fff; }
        .cd-done { opacity: .5; } .cd-done .cd-title { text-decoration: line-through; }
        .cd-title { font-size: 14px; font-weight: 600; }
        .cd-week { display: grid; grid-template-columns: repeat(7, minmax(150px, 1fr)); gap: 10px; overflow-x: auto; }
        .cd-wcol { padding: 12px; min-height: 180px; }
        .cd-chip { display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,0.04); margin-top: 6px; font-size: 12px; cursor: pointer; border: 1px solid transparent; border-left-width: 3px; color: #fff; }
        .cd-chip:hover { background: rgba(255,255,255,0.08); }
        .cd-seg { display: inline-flex; background: #11151C; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 3px; }
        .cd-seg button { padding: 7px 14px; font-size: 12px; font-weight: 600; border-radius: 9px; color: #9CA3AF; cursor: pointer; }
        .cd-seg button.on { background: rgba(67,120,255,.18); color: #4378FF; }
        /* modal */
        .cd-overlay { position: fixed; inset: 0; background: rgba(4,6,10,.75); backdrop-filter: blur(6px); z-index: 80; display: flex; align-items: flex-start; justify-content: center; padding: 4vh 16px; overflow-y: auto; }
        .cd-modal { width: 100%; max-width: 720px; padding: 26px; background: #0D1016; border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; }
        .cd-modal h2 { font-size: 18px; font-weight: 800; font-family: Geist, Inter, sans-serif; }
        .cd-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 18px 0; }
        .cd-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
        .cd-field.full { grid-column: 1 / -1; }
        .cd-field > label { font-size: 11px; font-weight: 700; color: #9CA3AF; }
        .cd-field > label em { color: #f87171; font-style: normal; }
        .cd-chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .cd-chips label { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); font-size: 12px; cursor: pointer; }
        .cd-chips input:checked + span { color: #4378FF; font-weight: 700; }
        .cd-sub-rows { display: flex; flex-direction: column; gap: 8px; }
        .cd-subrow { display: grid; gap: 8px; align-items: center; padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.04); }
        .cd-checkrow { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; padding-top: 6px; }
        .cd-foot { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
        #cdToastRoot { position: fixed; bottom: 24px; right: 24px; z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
        .cd-toast { padding: 12px 18px; border-radius: 14px; background: #11151C; border: 1px solid rgba(255,255,255,0.1); font-size: 13px; font-weight: 600; box-shadow: 0 10px 40px rgba(0,0,0,.5); max-width: 360px; }
        .cd-toast.err { border-color: rgba(248,113,113,.5); color: #fca5a5; }
        .cd-toast.ok { border-color: rgba(34,197,94,.4); }
        .cd-detail { white-space: pre-wrap; font-size: 13px; color: #D1D5DB; line-height: 1.55; }
        @media (max-width: 767px) {
            .cd-form { grid-template-columns: 1fr; }
            .cd-modal { padding: 18px; }
            .cd-bar .cd-input, .cd-bar .cd-select { flex: 1 1 130px; }
            .cd-days { gap: 4px; }
            .cd-day { padding: 8px 2px; }
            .cd-time { width: 44px; }
        }
    </style>

<body class="h-screen flex overflow-hidden">

    <aside id="sidebar" class="w-[280px] border-r border-nlt-border flex flex-col justify-between shrink-0 bg-nlt-bg/50 backdrop-blur-xl"></aside>

    <main class="flex-1 min-w-0 flex flex-col h-full">
        <header class="h-24 flex items-center justify-between pl-20 pr-10 md:px-10 shrink-0 border-b border-nlt-border/50 bg-nlt-bg/50 backdrop-blur-md">
            <div>
                <p class="text-[10px] font-bold text-yellow-400 uppercase tracking-widest mb-0.5">Espacio de administración</p>
                <h1 class="text-2xl font-bold tracking-tight">Workspace NLT</h1>
            </div>
            <div class="flex items-center gap-3">
                <span id="cdSync" class="cd-lbl hidden md:inline"></span>
                <button id="cdRefresh" class="cd-btn sm" title="Actualizar datos"><i class="ph ph-arrows-clockwise"></i><span class="hidden md:inline">Actualizar</span></button>
            </div>
        </header>

        <nav id="cdTabs" class="flex items-center flex-nowrap md:flex-wrap gap-x-1.5 md:gap-x-1 gap-y-2 overflow-x-auto md:overflow-visible px-4 md:px-10 py-3 border-b border-white/5 shrink-0"></nav>

        <div class="flex-1 min-w-0 overflow-y-auto p-4 md:p-10">
            <div id="cdContent" class="cd-wrap"></div>
        </div>
    </main>

    <div id="cdModalRoot"></div>
    <div id="cdToastRoot"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/nlt-shared.js?v=4ee7c395"></script>
    <script src="assets/js/nlt-api-client.js?v=a4cb4a36"></script>
    <script>
    (function () {
        'use strict';

        // ------------------------------------------------------------------
        // Utilidades
        // ------------------------------------------------------------------
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const uid = (p) => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        const clone = (o) => JSON.parse(JSON.stringify(o));
        const pad = (n) => String(n).padStart(2, '0');
        const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        const hoy = () => ymd(new Date());
        const parseYmd = (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
        const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
        const fmtDate = (s) => { if (!s) return '—'; const [y, m, d] = String(s).slice(0, 10).split('-'); return d ? `${d}/${m}/${y}` : esc(s); };
        const DIAS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
        const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
        const money = (n) => new Intl.NumberFormat('es', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 }).format(Number(n) || 0);
        const num = (v) => (v === '' || v == null || isNaN(Number(v)) ? undefined : Number(v));
        const lower = (s) => String(s ?? '').toLowerCase();
        const diasHasta = (s) => Math.round((parseYmd(s) - parseYmd(hoy())) / 86400000);

        // ------------------------------------------------------------------
        // Catálogos
        // ------------------------------------------------------------------
        const DEPTS = [
            { id: 'dept-afiliados', name: 'Afiliados', color: '#0ea5e9' },
            { id: 'dept-finanzas', name: 'Finanzas', color: '#22C55E' },
            { id: 'dept-marketing', name: 'Marketing', color: '#F59E0B' },
            { id: 'dept-programacion', name: 'Programación', color: '#6366f1' },
            { id: 'dept-informes', name: 'Informes', color: '#06b6d4' },
            { id: 'dept-academia', name: 'Academia', color: '#8b5cf6' },
            { id: 'dept-reuniones', name: 'Reuniones', color: '#a78bfa' },
        ];
        const dept = (id) => DEPTS.find((d) => d.id === id);
        const deptOpts = () => DEPTS.map((d) => ({ v: d.id, l: d.name }));
        const O = (pairs) => pairs.map(([v, l, tone]) => ({ v, l, tone }));
        const AVATAR_COLORS = ['#4378FF', '#22C55E', '#F59E0B', '#a78bfa', '#06b6d4', '#ef4444', '#ec4899'];

        // ------------------------------------------------------------------
        // Estado
        // ------------------------------------------------------------------
        const S = { team: [], items: [], affiliates: [], meetings: [], contracts: [], payments: [], publications: [], launches: [], devChanges: [], academyClasses: [], reports: [] };
        const PAGE = 100;   // filas visibles por lista: con miles de registros, pintarlas todas congelaba la página
        const UI = { tab: 'daily', q: '', status: 'all', dept: 'all', type: 'all', date: hoy(), agendaView: 'day', month: hoy().slice(0, 7), limit: PAGE };
        let SESSION = null;
        let IS_GLOBAL = false;
        let PUSH_ON = false;   // este dispositivo ya recibe los avisos por push (con la página cerrada)
        let renderActividadCargando = false;
        let pendingSaves = 0;
        let modalOpen = false;
        let formDirty = false;
        let LASTSIG = '';
        let DATA_CHANGED = true;
        let LOAD_ERR = '';

        const member = (id) => S.team.find((m) => m.id === id);
        const mname = (id) => (member(id) ? member(id).name : '—');
        const memberOpts = () => S.team.filter((m) => m.active !== false).map((m) => ({ v: m.id, l: m.name }));
        const affiliateOpts = () => S.affiliates.map((a) => ({ v: a.id, l: `${a.affiliateCode || ''} · ${a.fullName}` }));
        const initials = (name) => String(name || '?').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();

        // ------------------------------------------------------------------
        // Definición de módulos (motor genérico)
        //   t: text|textarea|date|time|number|money|select|dept|member|members|affiliate|tags|check|url|email|tel|rows
        // ------------------------------------------------------------------
        const ST_AFF = O([['active', 'Activo', 'ok'], ['pending', 'Pendiente', 'warn'], ['inactive', 'Inactivo', 'mute']]);
        const ST_PAY = O([['paid', 'Pagado', 'ok'], ['processing', 'En proceso', 'info'], ['pending', 'Pendiente', 'warn']]);
        const ST_CONTRACT = O([['vigente', 'Vigente', 'ok'], ['por_vencer', 'Por vencer', 'warn'], ['vencido', 'Vencido', 'bad'], ['rescindido', 'Rescindido', 'mute']]);
        const ST_MKT = O([['borrador', 'Borrador', 'mute'], ['en_revision', 'En revisión', 'warn'], ['programado', 'Programado', 'info'], ['publicado', 'Publicado', 'ok']]);
        const ST_LAUNCH = O([['planificado', 'Planificado', 'mute'], ['en_cuenta_regresiva', 'Cuenta regresiva', 'warn'], ['lanzado', 'Lanzado', 'ok'], ['pospuesto', 'Pospuesto', 'bad']]);
        const ST_DEV = O([['pendiente', 'Pendiente', 'warn'], ['en_progreso', 'En progreso', 'info'], ['resuelto', 'Resuelto', 'ok'], ['desplegado', 'Desplegado', 'vio']]);
        const ST_ACAD = O([['planificada', 'Planificada', 'mute'], ['grabada', 'Grabada', 'info'], ['en_edicion', 'En edición', 'warn'], ['lista_para_subir', 'Lista para subir', 'vio'], ['subida', 'Subida', 'ok'], ['cancelada', 'Cancelada', 'bad']]);
        const ST_ITEM = O([['pending', 'Pendiente', 'warn'], ['in_progress', 'En curso', 'info'], ['completed', 'Completada', 'ok']]);
        const PRIO_ITEM = O([['high', 'Alta', 'bad'], ['medium', 'Media', 'warn'], ['normal', 'Normal', 'mute']]);
        const TYPE_ITEM = O([['task', 'Tarea'], ['meeting', 'Reunión'], ['reminder', 'Recordatorio']]);
        const LEAD = O([['none', 'Sin recordatorio'], ['at_time', 'A la hora'], ['15_min', '15 min antes'], ['30_min', '30 min antes'], ['1_hour', '1 hora antes'], ['2_hours', '2 horas antes'], ['1_day', '1 día antes']]);
        const LEAD_MIN = { at_time: 0, '15_min': 15, '30_min': 30, '1_hour': 60, '2_hours': 120, '1_day': 1440 };

        // Estado efectivo de un contrato: rescindido manda; si no, se calcula por fechas.
        function estadoContrato(c) {
            if (c.status === 'rescindido') return 'rescindido';
            if (c.isIndefinite || !c.endDate) return 'vigente';
            const d = diasHasta(c.endDate);

                sort: (a, b) => String(a.launchDate || '').localeCompare(String(b.launchDate || '')),
                card: (r) => { const d = diasHasta(r.launchDate); const cuenta = r.status === 'lanzado' ? 'Lanzado' : d < 0 ? `Hace ${-d} d` : d === 0 ? 'Hoy' : `Faltan ${d} d`; const st = ST_LAUNCH.find((o) => o.v === r.status); return { title: r.title, sub: `${fmtDate(r.launchDate)}${r.launchTime ? ' · ' + r.launchTime : ''} · ${cuenta}`, lines: [r.whatWillLaunch ? String(r.whatWillLaunch).slice(0, 140) : '', (r.channels || []).length ? 'Canales: ' + r.channels.join(', ') : ''].filter(Boolean), badge: st ? [st.l, st.tone] : null }; },
                report: { date: 'launchDate', status: 'status', cols: [['Lanzamiento', 'title'], ['Fecha', 'launchDate'], ['Estado', 'status'], ['Responsable', (r) => mname(r.responsibleId)], ['Canales', (r) => (r.channels || []).join('; ')]] },

        };
        const ORDER = ['daily', 'team', 'affiliates', 'finance', 'contracts', 'meetings', 'marketing', 'academy', 'development', 'launches', 'reports', 'activity', 'settings'];

        // Estado efectivo (con statusFn si el módulo calcula el estado)
        const statusOf = (m, r) => (m.statusFn ? m.statusFn(r) : r[m.statusKey]);

        // ------------------------------------------------------------------
        // Capa de datos (NLT_API) -- guardado optimista por registro
        // ------------------------------------------------------------------
        function toast(msg, kind) {
            const root = document.getElementById('cdToastRoot');
            const el = document.createElement('div');
            el.className = 'cd-toast ' + (kind || '');
            el.textContent = msg;
            root.appendChild(el);
            setTimeout(() => el.remove(), kind === 'err' ? 6000 : 2800);
        }

        async function cargar(silencioso) {
            try {
                const snap = await NLT_API.coordinaSnapshot();
                const sig = JSON.stringify(snap.collections || {});
                DATA_CHANGED = sig !== LASTSIG;   // si el sondeo no trae nada nuevo, no se vuelve a pintar todo
                if (DATA_CHANGED) { LASTSIG = sig; for (const k of Object.keys(S)) S[k] = (snap.collections && snap.collections[k]) || []; }
                LOAD_ERR = '';
                document.getElementById('cdSync').textContent = 'Sincronizado ' + new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
                return true;
            } catch (e) {
                LOAD_ERR = e.message || 'Error de red';
                if (!silencioso) toast('No se pudieron cargar los datos: ' + LOAD_ERR, 'err');
                return false;
            }
        }

        async function guardar(col, rec) {
            const lista = S[col];
            const i = lista.findIndex((x) => x.id === rec.id);
            const previo = i >= 0 ? lista[i] : null;
            if (i >= 0) lista[i] = rec; else lista.push(rec);
            pendingSaves++;
            try {
                const { _updated_at, ...limpio } = rec;
                const r = await NLT_API.coordinaGuardar(col, rec.id, limpio, _updated_at);
                if (r && r.updated_at) rec._updated_at = r.updated_at;   // la siguiente edición parte de esta versión
                LASTSIG = '';
                return true;
            } catch (e) {
                if (previo) lista[i] = previo; else lista.splice(lista.findIndex((x) => x.id === rec.id), 1);
                if (e.status === 409) { toast(e.message, 'err'); closeModal(); cargar(true).then(render); }   // alguien más lo editó: se recargan los datos
                else toast('No se pudo guardar: ' + e.message, 'err');
                return false;
            } finally { pendingSaves--; }
        }

        async function borrar(col, id) {
            const lista = S[col];
            const i = lista.findIndex((x) => x.id === id);
            if (i < 0) return;
            const previo = lista.splice(i, 1)[0];
            pendingSaves++;
            try { await NLT_API.coordinaBorrar(col, id); LASTSIG = ''; return true; }
            catch (e) { lista.splice(i, 0, previo); toast('No se pudo borrar: ' + e.message, 'err'); return false; }
            finally { pendingSaves--; }
        }

        // ------------------------------------------------------------------
        // Formulario genérico (modal)
        // ------------------------------------------------------------------
        function closeModal() { document.getElementById('cdModalRoot').innerHTML = ''; modalOpen = false; formDirty = false; }
        function pedirCerrar() { if (formDirty && !confirm('¿Descartar los cambios sin guardar?')) return; closeModal(); }
        function openModal(html, sticky) {
            const root = document.getElementById('cdModalRoot');
            formDirty = false;
            // En formularios (sticky) un clic fuera NO cierra: un toque accidental borraba todo lo escrito.
            root.innerHTML = `<div class="cd-overlay" ${sticky ? '' : 'data-act="overlay"'}><div class="cd-modal" role="dialog" aria-modal="true">${html}</div></div>`;
            modalOpen = true;
            const first = root.querySelector('input:not([type=checkbox]),select,textarea');
            if (first) first.focus();
        }

        function fieldInput(f, val, name) {
            const v = val == null ? '' : val;
            const n = `name="${esc(name)}"${name.startsWith('__sub_') ? '' : ` id="f_${esc(name)}"`}`;
            switch (f.t) {
                case 'textarea': return `<textarea class="cd-textarea" ${n}>${esc(v)}</textarea>`;
                case 'date': case 'time': return `<input class="cd-input" type="${f.t}" ${n} value="${esc(v)}">`;
                case 'number': case 'money': return `<input class="cd-input" type="number" step="any" ${n} value="${esc(v)}">`;
                case 'email': case 'tel': case 'url': return `<input class="cd-input" type="${f.t}" ${n} value="${esc(v)}" ${f.ph ? `placeholder="${esc(f.ph)}"` : ''}>`;
                case 'tags': return `<input class="cd-input" type="text" ${n} value="${esc(Array.isArray(val) ? val.join(', ') : v)}">`;
                case 'check': return `<label class="cd-checkrow"><input type="checkbox" ${n} ${val ? 'checked' : ''}> ${esc(f.l)}</label>`;
                case 'select': case 'dept': case 'member': case 'affiliate': {
                    const opts = f.t === 'dept' ? deptOpts() : f.t === 'member' ? memberOpts() : f.t === 'affiliate' ? affiliateOpts() : f.opts;
                    const lista = opts.slice();
                    if (v && !lista.some((o) => o.v === v)) lista.push({ v, l: v + ' (actual)' });
                    return `<select class="cd-select" ${n}>${f.t === 'select' ? '' : '<option value="">— Sin asignar —</option>'}${lista.map((o) => `<option value="${esc(o.v)}" ${o.v === v ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select>`;
                }
                case 'members': {
                    const sel = Array.isArray(val) ? val : [];
                    const lista = S.team.map((m) => ({ v: m.id, l: m.name }));
                    return lista.length ? `<div class="cd-chips">${lista.map((o) => `<label><input type="checkbox" name="${esc(name)}" value="${esc(o.v)}" ${sel.includes(o.v) ? 'checked' : ''} hidden><span>${esc(o.l)}</span></label>`).join('')}</div>` : '<span class="cd-sub">Añade miembros en “Mi Equipo” primero.</span>';
                }
                default: return `<input class="cd-input" type="text" ${n} value="${esc(v)}" ${f.ph ? `placeholder="${esc(f.ph)}"` : ''}>`;
            }
        }

        function rowHTML(f, row) {
            const cells = f.sub.map((s) => `<div>${fieldInput(s, row[s.k], '__sub_' + s.k)}</div>`).join('');
            return `<div class="cd-subrow" style="grid-template-columns:${f.grid} auto">${cells}<button type="button" class="cd-btn sm danger" data-act="row-del" title="Quitar">✕</button></div>`;
        }

        function formHTML(m, rec) {
            return m.fields.map((f) => {
                const val = rec[f.k];
                const full = f.full || f.t === 'rows' || f.t === 'textarea' || f.t === 'members' ? ' full' : '';
                if (f.t === 'check') return `<div class="cd-field${full}">${fieldInput(f, f.dflt ? val !== false : val, f.k)}</div>`;
                if (f.t === 'rows') {
                    const rows = (val && val.length ? val : []).map((r) => rowHTML(f, r)).join('');
                    return `<div class="cd-field full"><label>${esc(f.l)}</label><div class="cd-sub-rows" data-rows="${esc(f.k)}">${rows}</div><div><button type="button" class="cd-btn sm" data-act="row-add" data-k="${esc(f.k)}">＋ ${esc(f.add || 'Añadir')}</button></div></div>`;
                }
                return `<div class="cd-field${full}"><label for="f_${esc(f.k)}">${esc(f.l)}${f.req ? ' <em>*</em>' : ''}</label>${fieldInput(f, val, f.k)}</div>`;
            }).join('');
        }

        function readValue(f, root, name) {
            const els = root.querySelectorAll(`[name="${name}"]`);
            if (f.t === 'check') return !!(els[0] && els[0].checked);
            if (f.t === 'members') return Array.from(els).filter((e) => e.checked).map((e) => e.value);
            const el = els[0];
            if (!el) return undefined;
            if (f.t === 'number' || f.t === 'money') return num(el.value);
            if (f.t === 'tags') return el.value.split(',').map((s) => s.trim()).filter(Boolean);
            return el.value.trim();
        }

        function collect(m, form, base) {
            const rec = { ...base };
            for (const f of m.fields) {
                if (f.t === 'rows') {
                    rec[f.k] = Array.from(form.querySelectorAll(`[data-rows="${f.k}"] .cd-subrow`)).map((row) => {
                        const o = {};
                        for (const s of f.sub) o[s.k] = readValue(s, row, '__sub_' + s.k);
                        return o;
                    });
                } else rec[f.k] = readValue(f, form, f.k);
            }
            return rec;
        }

        function openForm(modId, rec, presets) {
            const m = MODS[modId];
            const nuevo = !rec;
            const base = rec ? clone(rec) : { id: uid(m.col.slice(0, 3)), createdAt: new Date().toISOString() };
            if (nuevo) for (const f of m.fields) if (f.def !== undefined) base[f.k] = typeof f.def === 'function' ? f.def() : f.def;
            if (nuevo && presets) Object.assign(base, presets);
            openModal(`
                <h2>${nuevo ? esc(m.newLabel) : 'Editar ' + esc(m.singular)}</h2>
                <form id="cdForm" novalidate><div class="cd-form">${formHTML(m, base)}</div>
                    <div class="cd-foot"><button type="button" class="cd-btn" data-act="close">Cancelar</button><button type="submit" class="cd-btn primary"><i class="ph-bold ph-check"></i> Guardar</button></div>
                </form>`, true);
            const form = document.getElementById('cdForm');
            form.addEventListener('input', () => { formDirty = true; });
            form.addEventListener('change', () => { formDirty = true; });
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                let out = collect(m, form, base);
                for (const f of m.fields) {
                    if (f.req && (out[f.k] == null || out[f.k] === '')) { toast(`Falta: ${f.l}`, 'err'); form.querySelector(`[name="${f.k}"]`)?.focus(); return; }
                }
                if (m.before) m.before(out);
                const btn = form.querySelector('button[type=submit]'); btn.disabled = true;
                const ok = await guardar(m.col, out);
                if (ok && AUTO[m.col]) await sincronizarRecordatorio(m.col, out);   // publicación / reunión / lanzamiento -> recordatorio en la agenda
                if (ok) { closeModal(); toast(nuevo ? 'Creado' : 'Guardado', 'ok'); render(); } else btn.disabled = false;
            });
        }

        // ------------------------------------------------------------------
        // Vistas
        // ------------------------------------------------------------------
        function filtrar(m, lista) {
            const q = lower(UI.q).trim();
            return lista.filter((r) => {
                if (UI.status !== 'all' && m.statusKey && statusOf(m, r) !== UI.status) return false;
                if (q && !(m.search || []).some((k) => lower(r[k]).includes(q))) return false;
                return true;
            }).sort(m.sort || (() => 0));
        }

        function kpisHTML(m, lista) {
            if (!m.kpis) return '';
            return `<div class="cd-kpis">${m.kpis(lista).map(([l, v, tone]) => `<div class="glass-card cd-kpi"><span class="cd-lbl">${esc(l)}</span><b class="${tone ? 'cd-tone-' + tone : ''}">${esc(v)}</b></div>`).join('')}</div>`;
        }

        function listHTML(modId) {
            const m = MODS[modId];
            const lista = filtrar(m, S[m.col]);

            const mas = lista.length < total ? `<div style="text-align:center;margin-top:14px"><button class="cd-btn" data-act="more">Mostrar más (${total - lista.length} restantes)</button></div>` : '';
            if (m.view === 'cards') {
                return `<div class="cd-cards">${lista.map((r, i) => {

                        ${(c.lines || []).map((l) => `<p>${esc(l)}</p>`).join('')}

            if (m.view === 'board') {

        // Cuántas cosas apuntan a un miembro del equipo (para avisar antes de borrarlo).
        function referenciasDe(id) {
            const cuentas = [
                ['tareas de la agenda', S.items.filter((x) => x.assigneeId === id).length],
                ['publicaciones', S.publications.filter((x) => x.assigneeId === id).length],
                ['clases (graba/edita)', S.academyClasses.filter((x) => x.recordedById === id || x.editedById === id).length],
                ['cambios de programación', S.devChanges.filter((x) => x.responsibleDevId === id).length],
                ['lanzamientos', S.launches.filter((x) => x.responsibleId === id).length],
                ['minutas (asistente o tarea)', S.meetings.filter((x) => (x.attendees || []).includes(id) || (x.actionItems || []).some((a) => a.assigneeId === id)).length],
            ].filter(([, n]) => n);
            return { total: cuentas.reduce((s, [, n]) => s + n, 0), detalle: cuentas.map(([l, n]) => `${n} ${l}`).join(', ') };
        }

        // --- Recordatorios automáticos: publicación / reunión / lanzamiento -> Agenda ---
        // Cada entrada crea (y mantiene al día) un recordatorio enlazado con `autoSource`. Así, al cambiar la
        // fecha del origen se mueve el recordatorio; al borrarlo desaparece; y si se marca como publicado /
        // lanzado, el recordatorio se completa solo (y el aviso push no vuelve a sonar).
        const HORA_POR_DEFECTO = '09:00';   // si la entrada no tiene hora, el recordatorio sale a esta hora del día
        const AUTO = {
            publications: { etiqueta: 'publicación', prefijo: 'Publicar', fecha: 'scheduledDate', hora: 'scheduledTime', titulo: 'title', resp: 'assigneeId', dept: () => 'dept-marketing', hecho: (r) => r.status === 'publicado', desc: (r) => [r.channel, r.campaignName].filter(Boolean).join(' · ') },
            meetings: { etiqueta: 'reunión', prefijo: 'Reunión', fecha: 'date', hora: 'time', titulo: 'topic', resp: null, dept: () => 'dept-reuniones', hecho: () => false, desc: (r) => (r.durationMinutes ? r.durationMinutes + ' min' : '') },
            launches: { etiqueta: 'lanzamiento', prefijo: 'Lanzamiento', fecha: 'launchDate', hora: 'launchTime', titulo: 'title', resp: 'responsibleId', dept: (r) => r.departmentId || 'dept-marketing', hecho: (r) => r.status === 'lanzado', desc: (r) => r.targetAudience || '' },
        };
        const zonaHoraria = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (_) { return undefined; } };
        const itemDeOrigen = (col, id) => S.items.find((i) => i.autoSource && i.autoSource.col === col && i.autoSource.id === id);

        function recordatorioDeseado(col, r) {
            const a = AUTO[col];
            if (!r[a.fecha]) return null;
            return {
                title: `${a.prefijo}: ${r[a.titulo] || ''}`.trim(), date: r[a.fecha], time: r[a.hora] || HORA_POR_DEFECTO,
                departmentId: a.dept(r), assigneeId: (a.resp && r[a.resp]) || '', description: a.desc(r), hecho: a.hecho(r),
            };
        }

        // Devuelve 1 si CREÓ un recordatorio nuevo (para contar en "sincronizar todo"), 0 en cualquier otro caso.
        async function sincronizarRecordatorio(col, r) {
            const ex = itemDeOrigen(col, r.id);
            if (r.recordatorioAgenda === false) { if (ex) await borrar('items', ex.id); return 0; }
            const d = recordatorioDeseado(col, r);
            if (!d) return 0;
            const ahora = new Date().toISOString();
            if (!ex) {
                if (d.date < hoy()) return 0;   // una entrada ya pasada no genera un recordatorio nuevo
                const item = {
                    id: uid('ite'), title: d.title, description: d.description, type: 'reminder', departmentId: d.departmentId, assigneeId: d.assigneeId,
                    coordinatorName: (SESSION && SESSION.user.email) || '', date: d.date, time: d.time, priority: 'normal', status: d.hecho ? 'completed' : 'pending',
                    automaticReminder: true, reminderLeadTime: '15_min', subtasks: [], createdAt: ahora, tz: zonaHoraria(), autoSource: { col, id: r.id },
                };
                if (d.hecho) { item.completedAt = ahora; item.autoDone = true; }
                return (await guardar('items', item)) ? 1 : 0;
            }
            const n = { ...ex, title: d.title, description: d.description, departmentId: d.departmentId, assigneeId: d.assigneeId, date: d.date, time: d.time };
            const reprogramado = ex.date !== d.date || ex.time !== d.time;
            if (reprogramado) n.tz = zonaHoraria();
            if (d.hecho) { if (n.status !== 'completed') { n.status = 'completed'; n.completedAt = ahora; } n.autoDone = true; }
            else if (n.autoDone) { n.status = 'pending'; delete n.completedAt; n.autoDone = false; }   // se des-marcó como publicado/lanzado
            else if (reprogramado && n.status === 'completed') { n.status = 'pending'; delete n.completedAt; }
            if (JSON.stringify(n) !== JSON.stringify(ex)) await guardar('items', n);
            return 0;
        }

        async function quitarRecordatoriosDe(col, id) {
            for (const it of S.items.filter((i) => i.autoSource && i.autoSource.col === col && i.autoSource.id === id)) await borrar('items', it.id);
        }

        // Para lo que ya existía antes de esta función (o se importó): crea los que falten y actualiza los demás.
        async function sincronizarTodo() {
            let creados = 0;
            for (const col of Object.keys(AUTO)) for (const r of S[col].slice()) creados += await sincronizarRecordatorio(col, r);
            return creados;
        }

        // --- Agenda por departamento: cada módulo de departamento muestra las actividades de la Agenda que le pertenecen ---
        const DEPT_DE_MODULO = { affiliates: 'dept-afiliados', finance: 'dept-finanzas', marketing: 'dept-marketing', meetings: 'dept-reuniones', academy: 'dept-academia', development: 'dept-programacion', reports: 'dept-informes' };
        function agendaDeDeptoHTML(deptId) {
            const d = dept(deptId);
            if (!d) return '';
            const pend = S.items.filter((i) => i.departmentId === deptId && i.status !== 'completed')
                .sort((a, b) => (String(a.date) + (a.time || '99:99')).localeCompare(String(b.date) + (b.time || '99:99')));
            const vencidas = pend.filter((i) => i.date < hoy()).length;
            const lista = pend.slice(0, 5);
            return `<div class="glass-card" style="padding:18px;margin-bottom:18px;border-left:3px solid ${d.color}">
                <div class="cd-bar" style="margin-bottom:${lista.length ? 12 : 0}px">
                    <div style="font-weight:800;font-size:14px;font-family:Geist,Inter,sans-serif"><span class="cd-dot" style="background:${d.color};margin-right:8px"></span>Agenda de ${esc(d.name)}</div>
                    <span class="cd-badge">${pend.length} pendiente${pend.length === 1 ? '' : 's'}</span>${vencidas ? `<span class="cd-badge cd-tone-bad">${vencidas} vencida${vencidas === 1 ? '' : 's'}</span>` : ''}
                    <div class="cd-grow"></div>
                    ${pend.length ? `<button class="cd-btn sm" data-act="ver-agenda-dept" data-dept="${esc(deptId)}">Ver en la Agenda</button>` : ''}
                    <button class="cd-btn sm primary" data-act="new" data-mod="daily" data-dept="${esc(deptId)}"><i class="ph-bold ph-plus"></i> Actividad</button>
                </div>
                ${lista.length ? lista.map((i) => agendaItemHTML(i, { fecha: true })).join('') : '<p class="cd-sub" style="margin-top:8px">Sin actividades pendientes de este departamento.</p>'}
                ${pend.length > lista.length ? `<p class="cd-sub" style="margin-top:8px">+${pend.length - lista.length} más en la Agenda.</p>` : ''}
            </div>`;
        }

        // --- Agenda diaria / semanal ---
        function agendaItemsDe(fecha) {
            return S.items.filter((i) => i.date === fecha).filter((i) => {
                if (UI.dept !== 'all' && i.departmentId !== UI.dept) return false;
                if (UI.type !== 'all' && i.type !== UI.type) return false;
                if (UI.status !== 'all' && i.status !== UI.status) return false;
                const q = lower(UI.q).trim();
                return !q || ['title', 'description', 'notes'].some((k) => lower(i[k]).includes(q));
            }).sort((a, b) => String(a.time || '99:99').localeCompare(String(b.time || '99:99')));
        }

        function agendaItemHTML(i, opts) {
            opts = opts || {};
            const d = dept(i.departmentId);
            const done = i.status === 'completed';
            const subs = i.subtasks || [];
            const pr = optOf(PRIO_ITEM, i.priority);
            const ty = optOf(TYPE_ITEM, i.type);
            return `<div class="glass-card cd-item ${done ? 'cd-done' : ''}" style="border-left:3px solid ${d ? d.color : '#374151'}">
                <button class="cd-check ${done ? 'on' : ''}" data-act="toggle" data-id="${esc(i.id)}" title="Marcar como ${done ? 'pendiente' : 'completada'}"><i class="ph-bold ph-check"></i></button>
                <div class="cd-time${opts.fecha ? ' wide' : ''}">${opts.fecha ? `<span class="${i.date < hoy() ? 'cd-tone-bad' : ''}">${fmtDate(i.date).slice(0, 5)}</span><br>` : ''}${esc(i.time || '—')}</div>
                <div style="flex:1;min-width:0">
                    <div class="cd-title">${esc(i.title)}</div>
                    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">
                        ${ty ? `<span class="cd-badge">${esc(ty.l)}</span>` : ''}${d ? `<span class="cd-badge"><span class="cd-dot" style="background:${d.color}"></span>${esc(d.name)}</span>` : ''}
                        ${i.priority === 'high' ? `<span class="cd-badge cd-tone-bad">Alta prioridad</span>` : pr && i.priority === 'medium' ? `<span class="cd-badge cd-tone-warn">Media</span>` : ''}
                        ${i.assigneeId ? `<span class="cd-badge">👤 ${esc(mname(i.assigneeId))}</span>` : ''}${i.status === 'in_progress' ? '<span class="cd-badge cd-tone-info">En curso</span>' : ''}
                        ${i.automaticReminder && i.reminderLeadTime !== 'none' ? '<span class="cd-badge cd-tone-vio">🔔</span>' : ''}${i.autoSource ? `<span class="cd-badge" title="Se actualiza solo con su ${esc((AUTO[i.autoSource.col] || {}).etiqueta || 'origen')}">🔗 desde ${esc((AUTO[i.autoSource.col] || {}).etiqueta || 'origen')}</span>` : ''}${subs.length ? `<span class="cd-badge">${subs.filter((s) => s.completed).length}/${subs.length} subtareas</span>` : ''}
                    </div>
                    ${i.description ? `<p class="cd-sub" style="margin-top:6px">${esc(i.description)}</p>` : ''}${i.locationOrLink ? `<p class="cd-sub">📍 ${esc(i.locationOrLink)}</p>` : ''}
                </div>
                ${actionsHTML('daily', i, { detail: false })}
            </div>`;
        }

        function agendaBody() {
            if (UI.agendaView === 'week') {
                const lunes = addDays(UI.date, -((parseYmd(UI.date).getDay() + 6) % 7));
                return `<div class="cd-week">${Array.from({ length: 7 }, (_, n) => addDays(lunes, n)).map((f) => {
                    const its = agendaItemsDe(f);
                    return `<div class="glass-card cd-wcol"><div class="cd-lbl ${f === hoy() ? 'cd-tone-info' : ''}">${DIAS[parseYmd(f).getDay()]} ${parseYmd(f).getDate()}</div>${its.map((i) => `<button class="cd-chip" data-act="edit" data-mod="daily" data-id="${esc(i.id)}" style="border-left-color:${(dept(i.departmentId) || {}).color || '#374151'}"><b>${esc(i.time || '')}</b> ${esc(i.title)}</button>`).join('') || '<div class="cd-sub" style="margin-top:8px">Libre</div>'}</div>`;
                }).join('')}</div>`;
            }
            const todas = agendaItemsDe(UI.date);
            const its = todas.slice(0, UI.limit);
            const mas = todas.length > its.length ? `<div style="text-align:center;margin-top:14px"><button class="cd-btn" data-act="more">Mostrar más (${todas.length - its.length} restantes)</button></div>` : '';
            return its.length ? its.map(agendaItemHTML).join('') + mas : `<div class="glass-card cd-empty"><i class="ph ph-calendar-blank"></i>No hay actividades para este día.</div>`;
        }

        function viewDaily() {
            const lunes = addDays(UI.date, -((parseYmd(UI.date).getDay() + 6) % 7));
            const dia = S.items.filter((i) => i.date === UI.date);
            const k = [['Actividades', dia.length], ['Completadas', dia.filter((i) => i.status === 'completed').length, 'ok'], ['Pendientes', dia.filter((i) => i.status !== 'completed').length, 'warn'], ['Urgentes', dia.filter((i) => i.priority === 'high' && i.status !== 'completed').length, 'bad'], ['Reuniones', dia.filter((i) => i.type === 'meeting').length, 'info']];
            const d = parseYmd(UI.date);
            return `
                <div class="cd-bar">
                    <button class="cd-btn sm" data-act="date-prev" title="Anterior"><i class="ph-bold ph-caret-left"></i></button>
                    <div style="font-weight:800;font-size:16px;font-family:Geist,Inter,sans-serif">${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]} ${d.getFullYear()}</div>
                    <button class="cd-btn sm" data-act="date-next" title="Siguiente"><i class="ph-bold ph-caret-right"></i></button>
                    <button class="cd-btn sm" data-act="date-today">Hoy</button>
                    <div class="cd-grow"></div>
                    <div class="cd-seg"><button data-act="aview" data-v="day" class="${UI.agendaView === 'day' ? 'on' : ''}">Día</button><button data-act="aview" data-v="week" class="${UI.agendaView === 'week' ? 'on' : ''}">Semana</button></div>
                    <button class="cd-btn primary" data-act="new" data-mod="daily"><i class="ph-bold ph-plus"></i> Nueva actividad</button>
                </div>
                <div class="cd-kpis">${k.map(([l, v, tone]) => `<div class="glass-card cd-kpi"><span class="cd-lbl">${l}</span><b class="${tone ? 'cd-tone-' + tone : ''}">${v}</b></div>`).join('')}</div>
                <div class="cd-days">${Array.from({ length: 7 }, (_, n) => addDays(lunes, n)).map((f) => { const c = S.items.filter((i) => i.date === f).length; const dd = parseYmd(f); return `<div class="cd-day ${f === UI.date ? 'sel' : ''} ${f === hoy() ? 'hoy' : ''}" data-act="date-set" data-d="${f}"><small>${DIAS[dd.getDay()]}</small><b>${dd.getDate()}</b><i>${c ? c + ' act.' : '·'}</i></div>`; }).join('')}</div>
                <div class="cd-bar">
                    <input class="cd-input cd-grow" id="cdSearch" type="search" placeholder="Buscar actividad…" value="${esc(UI.q)}">
                    <select class="cd-select" id="cdDept"><option value="all">Todos los departamentos</option>${DEPTS.map((x) => `<option value="${x.id}" ${UI.dept === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
                    <select class="cd-select" id="cdType"><option value="all">Todos los tipos</option>${TYPE_ITEM.map((x) => `<option value="${x.v}" ${UI.type === x.v ? 'selected' : ''}>${x.l}</option>`).join('')}</select>
                    <select class="cd-select" id="cdStatus"><option value="all">Todos los estados</option>${ST_ITEM.map((x) => `<option value="${x.v}" ${UI.status === x.v ? 'selected' : ''}>${x.l}</option>`).join('')}</select>
                </div>
                <div id="cdList">${agendaBody()}</div>`;
        }
        MODS.daily.col = 'items';
        MODS.daily.singular = 'actividad';
        MODS.daily.newLabel = 'Nueva actividad';
        MODS.daily.fields = [
            { k: 'title', l: 'Título', t: 'text', req: 1, full: 1 },
            { k: 'type', l: 'Tipo', t: 'select', opts: TYPE_ITEM, def: 'task' }, { k: 'departmentId', l: 'Departamento', t: 'dept', req: 1 },
            { k: 'date', l: 'Fecha', t: 'date', req: 1, def: () => UI.date }, { k: 'time', l: 'Hora', t: 'time' },
            { k: 'assigneeId', l: 'Responsable', t: 'member' }, { k: 'durationMinutes', l: 'Duración (min)', t: 'number' },
            { k: 'priority', l: 'Prioridad', t: 'select', opts: PRIO_ITEM, def: 'normal' }, { k: 'status', l: 'Estado', t: 'select', opts: ST_ITEM, def: 'pending' },
            { k: 'locationOrLink', l: 'Lugar o enlace (Meet/Teams)', t: 'text', full: 1 },
            { k: 'automaticReminder', l: 'Recordatorio automático (requiere hora)', t: 'check', def: true }, { k: 'reminderLeadTime', l: 'Avisar', t: 'select', opts: LEAD, def: '15_min' },
            { k: 'description', l: 'Descripción', t: 'textarea', full: 1 },
            { k: 'subtasks', l: 'Subtareas', t: 'rows', full: 1, add: 'Añadir subtarea', sub: [{ k: 'title', l: 'Subtarea', t: 'text' }, { k: 'completed', l: 'Hecha', t: 'check' }], grid: '1fr 80px' },
            { k: 'notes', l: 'Notas', t: 'textarea', full: 1 },
        ];
        MODS.daily.before = (r) => {
            r.subtasks = (r.subtasks || []).filter((s) => s.title).map((s) => ({ id: s.id || uid('st'), ...s }));
            r.coordinatorName = r.coordinatorName || (SESSION && SESSION.user.email) || '';
            try { r.tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (_) {}   // el servidor la usa para avisar a la hora correcta
            if (r.status === 'completed' && !r.completedAt) r.completedAt = new Date().toISOString();
            if (r.status !== 'completed') delete r.completedAt;
        };

        // --- Informes ---
        function reportRecords(modId, period) {
            const m = MODS[modId];
            const lista = S[m.col];
            if (period === 'all' || !m.report.date) return lista;
            return lista.filter((r) => String(r[m.report.date] || '').slice(0, 7) === period);
        }
        const cellValue = (c, r) => { const v = typeof c[1] === 'function' ? c[1](r) : r[c[1]]; return v == null ? '' : v; };
        // Un texto que empieza por = + - @ se ejecuta como fórmula al abrir el CSV en Excel/Sheets: se neutraliza con una comilla.
        const csvCell = (v) => { let t = String(v); if (typeof v === 'string' && /^[=+\-@\t\r]/.test(t)) t = "'" + t; return '"' + t.replace(/"/g, '""') + '"'; };

        function generarInforme(modId, period) {
            const m = MODS[modId];
            const rows = reportRecords(modId, period);
            const R = m.report;
            const header = R.cols.map((c) => csvCell(c[0])).join(',');
            const body = rows.map((r) => R.cols.map((c) => csvCell(cellValue(c, r))).join(','));
            const periodo = period === 'all' ? 'Histórico total' : `${MESES[Number(period.slice(5, 7)) - 1]} ${period.slice(0, 4)}`;
            const lineas = [`Informe de ${m.label} — ${periodo}`, `Registros: ${rows.length}`];
            if (R.status) {
                const cnt = {};
                rows.forEach((r) => { const s = typeof R.status === 'function' ? R.status(r) : r[R.status]; cnt[s] = (cnt[s] || 0) + 1; });
                const opts = m.statusOpts || [];
                lineas.push('Por estado: ' + (Object.keys(cnt).map((s) => `${(optOf(opts, s) || { l: s }).l} ${cnt[s]}`).join(' · ') || '—'));
            }
            (R.sums || []).forEach(([label, k]) => lineas.push(`${label}: ${money(rows.reduce((s, r) => s + (Number(r[k]) || 0), 0))}`));
            const quien = (SESSION && SESSION.user.email) || '';
            return {
                id: uid('rep'), title: `${m.label} — ${periodo}`, department: m.label, format: 'csv',
                fileName: `coordina-${modId}-${period}.csv`, generatedAt: new Date().toISOString(), generatedBy: quien, period: periodo,
                summary: lineas.join('\n'), content: '﻿' + [header, ...body].join('\n'),
            };
        }

        function descargar(nombre, contenido, tipo) {
            const url = URL.createObjectURL(new Blob([contenido], { type: tipo || 'text/plain;charset=utf-8' }));
            const a = document.createElement('a');
            a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1500);
        }

        function viewReports() {
            const mods = ORDER.filter((id) => MODS[id].report);
            const meses = [];
            for (let i = 0; i < 12; i++) { const d = new Date(); d.setMonth(d.getMonth() - i, 1); meses.push(ymd(d).slice(0, 7)); }
            const reps = S.reports.slice().sort((a, b) => String(b.generatedAt).localeCompare(String(a.generatedAt)));
            return agendaDeDeptoHTML(DEPT_DE_MODULO.reports) + `

                        <select class="cd-select" id="repPeriod"><option value="all">Histórico total</option>${meses.map((p) => `<option value="${p}" ${p === UI.month ? 'selected' : ''}>${MESES[Number(p.slice(5)) - 1]} ${p.slice(0, 4)}</option>`).join('')}</select>
                        <button class="cd-btn primary" data-act="rep-gen"><i class="ph-bold ph-file-arrow-down"></i> Generar y guardar</button>
                    </div>
                </div>
                ${reps.length ? `<div class="glass-card cd-scroll"><table class="cd-table"><thead><tr><th>Informe</th><th>Generado</th><th>Resumen</th><th></th></tr></thead><tbody>${reps.map((r) => `<tr><td><b>${esc(r.title)}</b><div class="cd-sub">${esc(r.generatedBy || '')}</div></td><td>${new Date(r.generatedAt).toLocaleString('es')}</td><td class="cd-sub" style="white-space:pre-line;max-width:380px">${esc(r.summary)}</td><td><div class="cd-row-actions"><button class="cd-btn sm" data-act="rep-dl" data-id="${esc(r.id)}"><i class="ph ph-download-simple"></i></button><button class="cd-btn sm danger" data-act="rep-del" data-id="${esc(r.id)}"><i class="ph ph-trash"></i></button></div></td></tr>`).join('')}</tbody></table></div>` : '<div class="glass-card cd-empty"><i class="ph ph-chart-bar"></i>Aún no has generado informes.</div>'}`;
        }

        function informeGlobal(period) {
            const periodo = period === 'all' ? 'Histórico total' : `${MESES[Number(period.slice(5, 7)) - 1]} ${period.slice(0, 4)}`;
            const filas = ORDER.filter((id) => MODS[id].report).map((id) => [MODS[id].label, reportRecords(id, period).length]);
            return {
                id: uid('rep'), title: `Operaciones global — ${periodo}`, department: 'Operaciones Global', format: 'csv',
                fileName: `coordina-global-${period}.csv`, generatedAt: new Date().toISOString(), generatedBy: (SESSION && SESSION.user.email) || '', period: periodo,
                summary: filas.map(([l, n]) => `${l}: ${n}`).join('\n'), content: '﻿' + ['"Módulo","Registros"', ...filas.map(([l, n]) => `${csvCell(l)},${n}`)].join('\n'),
            };
        }

        // --- Ajustes: respaldo, importación, avisos ---
        function viewSettings() {
            const totales = Object.entries(S).map(([k, v]) => `${k}: ${v.length}`).join(' · ');
            return `
                ${IS_GLOBAL ? `<div class="glass-card" style="padding:22px;margin-bottom:16px"><h3 style="font-weight:800;font-size:16px;margin-bottom:4px">Acceso del equipo</h3>
                    <p class="cd-sub" style="margin-bottom:14px">Elige quién puede entrar al Workspace con acceso completo (ver, crear, editar y borrar todo). Solo se activa este permiso: la persona <b>no</b> recibe acceso al resto del Admin Center. Solo tú, como Global Admin, puedes gestionar esto.</p>
                    <div id="cdAccessList" style="margin-bottom:16px"><p class="cd-sub">Cargando…</p></div>
                    <div class="cd-lbl" style="margin-bottom:8px">Dar acceso a otra persona</div>
                    <div class="cd-bar" style="margin-bottom:10px"><input class="cd-input cd-grow" id="cdAccessQ" type="search" placeholder="Buscar por correo (la persona debe tener cuenta en NLT)…"><button class="cd-btn" data-act="acc-search"><i class="ph ph-magnifying-glass"></i> Buscar</button></div>
                    <div id="cdAccessResults"></div></div>` : ''}
                <div class="glass-card" style="padding:22px;margin-bottom:16px"><h3 style="font-weight:800;font-size:16px;margin-bottom:4px">Respaldo de datos</h3>
