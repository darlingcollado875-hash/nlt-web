<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://wjczkcuxptzpayzemttb.supabase.co">
    <title>Become a Partner | NLT</title>
    <meta name="description" content="Partner with a growing trading ecosystem built for LATAM -- audience, content, community, technology and distribution.">
    <link rel="canonical" href="https://nltnextlevel.uk/become-partner">
    <meta property="og:title" content="Build with NLT">
    <meta property="og:description" content="Partner with a growing trading ecosystem built for LATAM.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nltnextlevel.uk/become-partner">
    <link rel="stylesheet" href="assets/css/tailwind.css?v=20260814e">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"></noscript>
    <link rel="preload" as="style" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/regular/style.css" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" as="style" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/fill/style.css" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/regular/style.css">
        <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/fill/style.css">
    </noscript>
    <style>
        html { overflow-x: hidden; }
        body { background-color: #080A0F; color: #ffffff; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        .glass-card { background: linear-gradient(180deg, rgba(17, 21, 28, 0.7) 0%, rgba(13, 16, 22, 0.9) 100%); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; }
        .nav-blur { backdrop-filter: blur(16px); background: rgba(8, 10, 15, 0.55); }
        .glow-button { box-shadow: 0 0 24px rgba(67, 120, 255, 0.4); }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .nlt-input { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 0.9rem 1rem; font-size: 0.875rem; color: #fff; transition: border-color var(--nlt-micro, 150ms) ease; }
        .nlt-input::placeholder { color: #6B7280; }
        .nlt-input:focus { outline: none; border-color: rgba(67,120,255,0.5); }
        .nlt-label { display: block; font-size: 0.75rem; font-weight: 600; color: #9CA6B4; margin-bottom: 0.4rem; }
        /* Honeypot -- oculto por CSS real (no display:none, algunos bots lo
           saltean), fuera de pantalla y sin foco por teclado. Un humano real
           nunca lo ve ni lo completa. */
        .nlt-honeypot { position: absolute; left: -9999px; top: -9999px; width: 1px; height: 1px; overflow: hidden; }
    </style>
</head>
<body class="min-h-screen relative">

    <div class="fixed top-[-15%] left-1/2 -translate-x-1/2 w-[900px] h-[600px] bg-blue-600/10 blur-[140px] rounded-full pointer-events-none z-0"></div>

    <header class="fixed top-0 inset-x-0 z-40 nav-blur border-b border-white/5">
        <div class="max-w-7xl mx-auto px-6 md:px-10 h-20 flex items-center justify-between">
            <a id="logoNLT" href="index.html" class="flex items-center gap-3"><img src="assets/img/nlt-icon.png" alt="NLT" class="w-8 h-8"><span class="font-semibold text-base tracking-tight">NLT</span></a>
            <nav class="hidden md:flex items-center gap-8 text-sm text-gray-400 font-medium">
                <a href="partners.html" class="hover:text-white transition-colors">Partners</a>
                <a href="business.html" class="hover:text-white transition-colors">For Business</a>
            </nav>
            <div id="headerCTA"></div>
        </div>
    </header>

    <section class="relative z-10 pt-40 pb-10 px-6 max-w-3xl mx-auto text-center">
        <p class="text-xs font-bold text-nlt-accent uppercase tracking-[0.2em] mb-6" data-reveal>BUILD WITH NLT</p>
        <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight leading-[1.05] mb-6" data-reveal>Partner with a growing trading ecosystem built for LATAM.</h1>
        <div class="flex flex-wrap items-center justify-center gap-2 text-xs text-gray-400" data-reveal>
            <span class="px-3 py-1.5 rounded-full border border-white/10">Audience</span>
            <span class="px-3 py-1.5 rounded-full border border-white/10">Content</span>
            <span class="px-3 py-1.5 rounded-full border border-white/10">Community</span>
            <span class="px-3 py-1.5 rounded-full border border-white/10">Technology</span>
            <span class="px-3 py-1.5 rounded-full border border-white/10">Distribution</span>
            <span class="px-3 py-1.5 rounded-full border border-white/10">Ecosystem exposure</span>
        </div>
    </section>

    <main class="relative z-10 max-w-2xl mx-auto px-6 pb-24">
        <form id="formPartner" class="glass-card p-6 md:p-10 space-y-5" data-reveal novalidate>

            <!-- Honeypot: nunca visible, nunca completado por un humano. -->
            <div class="nlt-honeypot" aria-hidden="true">
                <label for="companyWebsiteConfirm">Leave this field empty</label>
                <input type="text" id="companyWebsiteConfirm" name="company_website_confirm" tabindex="-1" autocomplete="off">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label class="nlt-label" for="fullName">Full Name *</label>
                    <input type="text" id="fullName" class="nlt-input" placeholder="Jane Doe" required maxlength="200">
                </div>
                <div>
                    <label class="nlt-label" for="company">Company *</label>
                    <input type="text" id="company" class="nlt-input" placeholder="Acme Trading Co." required maxlength="200">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label class="nlt-label" for="role">Role</label>
                    <input type="text" id="role" class="nlt-input" placeholder="Head of Partnerships" maxlength="200">
                </div>
                <div>
                    <label class="nlt-label" for="businessEmail">Business Email *</label>
                    <input type="email" id="businessEmail" class="nlt-input" placeholder="you@company.com" required maxlength="200">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label class="nlt-label" for="website">Website</label>
                    <input type="text" id="website" class="nlt-input" placeholder="https://company.com" maxlength="200">
                </div>
                <div>
                    <label class="nlt-label" for="country">Country / Region</label>
                    <input type="text" id="country" class="nlt-input" placeholder="Mexico, LATAM, Global..." maxlength="200">
                </div>
            </div>

            <div>
                <label class="nlt-label" for="partnershipType">Partnership Type *</label>
                <select id="partnershipType" class="nlt-input" required>
                    <option value="" disabled selected>Select one...</option>
                    <option>Broker</option>
                    <option>Prop Firm</option>
                    <option>Technology</option>
                    <option>Trading Platform</option>
                    <option>Payment Provider</option>
                    <option>Market Data</option>
                    <option>Education</option>
                    <option>Media</option>
                    <option>Creator</option>
                    <option>Strategic Partner</option>
                    <option>Other</option>
                </select>
            </div>

            <div>
                <label class="nlt-label" for="whatOffer">What do you offer?</label>
                <textarea id="whatOffer" class="nlt-input" rows="3" placeholder="Tell us what your company brings to the table..." maxlength="4000"></textarea>
            </div>
            <div>
                <label class="nlt-label" for="whatLookingFor">What are you looking for?</label>
                <textarea id="whatLookingFor" class="nlt-input" rows="3" placeholder="Distribution, integration, co-marketing..." maxlength="4000"></textarea>
            </div>
            <div>
                <label class="nlt-label" for="message">Message</label>
                <textarea id="message" class="nlt-input" rows="4" placeholder="Anything else we should know?" maxlength="4000"></textarea>
            </div>

            <!-- Opcionales -- nunca exigidos, ver Fase 2 del pedido. -->
            <details class="group">
                <summary class="text-xs font-semibold text-gray-400 cursor-pointer hover:text-white transition-colors select-none">+ Optional details (reach, budget, existing programs)</summary>
                <div class="mt-5 space-y-5">
                    <div>
                        <label class="nlt-label" for="monthlyReach">Monthly reach / audience</label>
                        <input type="text" id="monthlyReach" class="nlt-input" placeholder="e.g. 50k monthly visitors" maxlength="200">
                    </div>
                    <div>
                        <label class="nlt-label" for="existingAffiliateProgram">Existing affiliate program</label>
                        <textarea id="existingAffiliateProgram" class="nlt-input" rows="2" placeholder="Commission structure, terms, etc." maxlength="4000"></textarea>
                    </div>
                    <div>
                        <label class="nlt-label" for="budgetSponsorship">Budget / sponsorship</label>
                        <input type="text" id="budgetSponsorship" class="nlt-input" placeholder="If applicable" maxlength="200">
                    </div>
                    <div>
                        <label class="nlt-label" for="partnershipProposal">Partnership proposal</label>
                        <textarea id="partnershipProposal" class="nlt-input" rows="3" placeholder="A more detailed proposal, if you have one." maxlength="4000"></textarea>
                    </div>
                </div>
            </details>

            <button type="submit" id="btnEnviar" class="glow-button w-full mt-2 px-6 py-3.5 rounded-2xl bg-nlt-accent text-white font-semibold text-sm hover:bg-blue-500 transition-all cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                Submit Proposal
            </button>
            <div id="formMsg" class="hidden text-center text-sm p-3 rounded-xl font-medium"></div>
        </form>
    </main>

    <footer class="relative z-10 border-t border-white/5 py-10 px-6 md:px-10">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-gray-600">
            <div class="flex items-center gap-2"><img src="assets/img/nlt-icon.png" alt="NLT" class="w-5 h-5 opacity-70"><span>NLT Trading Ecosystem © 2026</span></div>
            <div class="flex items-center gap-4">
                <a href="partners.html" class="hover:text-gray-300 transition-colors">Partners</a>
                <a href="ecosystem.html" class="hover:text-gray-300 transition-colors">Volver al ecosistema</a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/nlt-shared.js?v=20260828"></script>
    <script src="assets/js/nlt-api-client.js?v=20260824"></script>
    <script>
        const form = document.getElementById('formPartner');
        const btn = document.getElementById('btnEnviar');
        const msgBox = document.getElementById('formMsg');

        function mostrarMensaje(texto, tipo) {
            msgBox.classList.remove('hidden');
            const clases = tipo === 'ok'
                ? 'bg-nlt-success/10 text-nlt-success border border-nlt-success/20'
                : 'bg-nlt-danger/10 text-nlt-danger border border-nlt-danger/20';
            msgBox.className = `text-center text-sm p-3 rounded-xl font-medium ${clases}`;
            msgBox.textContent = texto;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const company = document.getElementById('company').value.trim();
            const businessEmail = document.getElementById('businessEmail').value.trim();
            const partnershipType = document.getElementById('partnershipType').value;

            if (!fullName || !company || !businessEmail || !partnershipType) {
                mostrarMensaje('Full Name, Company, Business Email y Partnership Type son obligatorios.', 'error');
                return;
            }

            const datos = {
                full_name: fullName,
                company: company,
                role: document.getElementById('role').value.trim() || null,
                business_email: businessEmail,
                website: document.getElementById('website').value.trim() || null,
                country: document.getElementById('country').value.trim() || null,
                partnership_type: partnershipType,
                what_offer: document.getElementById('whatOffer').value.trim() || null,
                what_looking_for: document.getElementById('whatLookingFor').value.trim() || null,
                message: document.getElementById('message').value.trim() || null,
                monthly_reach: document.getElementById('monthlyReach').value.trim() || null,
                existing_affiliate_program: document.getElementById('existingAffiliateProgram').value.trim() || null,
                budget_sponsorship: document.getElementById('budgetSponsorship').value.trim() || null,
                partnership_proposal: document.getElementById('partnershipProposal').value.trim() || null,
                company_website_confirm: document.getElementById('companyWebsiteConfirm').value || null,
            };

            btn.disabled = true;
            btn.textContent = 'Sending...';
            msgBox.classList.add('hidden');

            try {
                const resp = await NLT_API.partnersAplicar(datos);
                mostrarMensaje(resp.message || 'Thanks -- the NLT team will review your proposal.', 'ok');
                form.reset();
                btn.textContent = 'Submitted ✓';
            } catch (err) {
                mostrarMensaje(err.message || 'No se pudo enviar la propuesta. Intentá de nuevo en unos minutos.', 'error');
                btn.disabled = false;
                btn.textContent = 'Submit Proposal';
            }
        });

        NLT.mountPublicHeader({ ctaBoxId: 'headerCTA', logoId: 'logoNLT' });

        // Motion System nativo (Performance Sprint) -- ver assets/js/nlt-shared.js.
        NLT.mountReveal();
        setTimeout(() => {
            document.querySelectorAll('[data-reveal]').forEach((el) => {
                if (getComputedStyle(el).opacity === '0') el.style.opacity = '1';
            });
        }, 2500);
    </script>
</body>
</html>
